<style>

lid #3a465b;color:#d5dbe5}

/* simplified referee flow */
.refSimple{max-width:560px;margin:0 auto}.refCountRow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end}.refCountRow input{min-width:0}.refHint{margin-top:10px;padding:11px 12px;border:1px solid #343e51;border-radius:12px;background:#0f141d;color:#aeb8c8;font-size:13px;line-height:1.6}.judgePick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.judgePick button{background:#202838;border:1px solid #3b465a}.judgePick button:hover{border-color:#ff8a4c}.sheetRefRow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sheetRefRow .status{flex:1;min-width:160px}.sheetRefRow .releaseBtn{padding:8px 12px}.sheetRef .pickTitle{margin-top:8px;color:#9da9bb;font-size:12px}.refCountBadge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 10px;border:1px solid #344158;border-radius:999px;background:#101620;color:#d9e0eb;font-size:13px}@media(max-width:520px){.refCountRow{grid-template-columns:1fr 90px}.refCountRow button{grid-column:1/-1}.judgePick{grid-template-columns:1fr 1fr}}

<body>
<header><div class="wrap brand">
  <div><h1>⚔️ Beyblade X Tournament</h1><small id="headSub">戰鬥陀螺賽程表</small></div>
  <div class="headActions">
    <button class="loginBtn" id="googleLoginBtn" type="button" onclick="handleHeaderLogin()">Google 登入</button>
    <button class="ghost homeBtnText" id="homeBtn" type="button" onclick="goHome()">首頁</button>
  </div>
</div></header>
<main class="wrap">
<section id="home">
 <div class="card hero">
  <h2>建立新賽事</h2>
  <div class="muted">先選擇賽制，再選擇這場要使用雲端同步或只在本機測試。</div>

  <div class="homeSection">
   <div class="homeSectionTitle">① 選擇賽制</div>
   <div class="homeChoices">
    <div id="choiceFree" class="choiceCard" onclick="selectHomeMode('free')"><div class="choiceIcon">🛠️</div><h3>自由編排</h3><div class="muted">自訂人數，支援12、24、36、48，最後三人循環賽等特殊賽事</div></div>
    <div id="choiceSingle" class="choiceCard" onclick="selectHomeMode('single')"><div class="choiceIcon">🏆</div><h3>單淘汰賽</h3><div class="muted">標準單淘汰賽，人數自動安排直到冠軍</div></div>
   </div>
  </div>

  <div class="homeSection">
   <div class="homeSectionTitle">② 選擇建立方式</div>
   <div class="homeChoices">
    <div id="choiceCloud" class="choiceCard" onclick="selectStorageMode('cloud')"><div class="choiceIcon">☁️</div><h3>雲端賽事</h3><div class="muted">可 QR 分享、主辦管理、跨手機同步比分與裁判狀態。</div></div>
    <div id="choiceTest" class="choiceCard" onclick="selectStorageMode('test')"><div class="choiceIcon">🧪</div><h3>測試賽事</h3><div class="muted">只存在這支手機，適合測試版面與比賽流程。</div></div>
   </div>
  </div>

  <button id="homeNextBtn" class="homeNext" onclick="proceedCreate()">下一步：設定賽事</button>
  <div id="homeSelectionSummary" class="homeSelectionSummary"></div>
 </div>

const STORE='bx_events_v2', CURRENT='bx_current_v2', SAVED='bx_saved_events_v1', KEEP='bx_test_event_v1'; let draftMode='free', draftStorage='cloud', ev=null;
let fbApp=null,fbAuth=null,fbDb=null,fbUser=null,cloudReady=false,cloudUnsub=null,isAdmin=false;

async function requireGoogleLogin(){
  if(!(await initCloud()))return false;
  if(isGoogleUser())return true;
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const result=await fbAuth.signInWithPopup(provider);
    fbUser=result.user||fbAuth.currentUser;
    renderHeaderAuth();
    renderHomeSelections();
    return isGoogleUser();
  }catch(e){
    console.error('Google popup login failed',e);
    if(e?.code==='auth/popup-blocked'){
      alert('Google 登入視窗被瀏覽器阻擋，請允許彈出式視窗後再試一次。');
    }else if(e?.code==='auth/popup-closed-by-user'){
      // 使用者自行關閉，不顯示錯誤。
    }else{
      alert('Google 登入失敗：'+(e?.message||e));
    }
    return false;
  }
}

function markEventSaved(id){
  if(!id)return;
  const ids=savedEventIds().filter(x=>x!==id);ids.unshift(id);setSavedEventIds(ids.slice(0,30));
}
function unmarkEventSaved(id){
  setSavedEventIds(savedEventIds().filter(x=>x!==id));
}
function formatSavedTime(ts){
  if(!ts)return '';
  try{return new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return ''}
}
function renderSavedEvents(){
  const box=$('savedEvents'),count=$('savedCount');if(!box||!count)return;
  const all=events(),ids=savedEventIds().filter(id=>all[id]);
  if(ids.length!==savedEventIds().length)setSavedEventIds(ids);
  count.textContent=ids.length+' 場';
  if(!ids.length){
    box.innerHTML='<div class=savedEmpty>目前沒有保留的賽事。建立新賽事後會顯示在這裡。</div>';
    return;
  }
  box.innerHTML=ids.map(id=>{
    const e=all[id],mode=e.mode==='free'?'自由編排':'單淘汰',when=formatSavedTime(e.created),isTest=!!e.testOnly;
    const typeHtml=isTest?'<span class="savedType test">🧪 測試賽事</span>':'<span class="savedType cloud">☁️ 雲端賽事</span>';
    const delLabel=isTest?'刪除本機':'刪除雲端';
    return `<div class="savedEvent ${isTest?'test':'cloud'}"><div><div class=savedEventName>${typeHtml}${esc(e.name||'Beyblade X Tournament')}</div><div class=savedEventMeta>${e.roster?.length||0} 人・${mode}${when?'・'+when:''}</div></div><div class=savedEventActions><button type="button" data-open-id="${id}">繼續</button><button type="button" class="danger" data-delete-id="${id}">${delLabel}</button></div></div>`;
  }).join('');

  box.querySelectorAll('[data-open-id]').forEach(btn=>{
    btn.addEventListener('click',()=>openSavedEvent(btn.dataset.openId));
  });
  box.querySelectorAll('[data-delete-id]').forEach(btn=>{
    btn.addEventListener('click',()=>requestDeleteSavedEvent(btn.dataset.deleteId));
  });
}
async function openSavedEvent(id){
  const cached=events()[id];if(!cached)return alert('找不到這場賽事的本機快取。');
  $('home').classList.add('hidden');
  if(cached.testOnly){
    ev=cached;isAdmin=true;
    $('create').classList.add('hidden');$('admin').classList.remove('hidden');
    history.replaceState(null,'',location.pathname);
    renderAdmin();return;
  }
  const ok=await loadCloudEvent(id);
  if(ok){history.replaceState(null,'',`${location.pathname}?event=${encodeURIComponent(id)}`);return}
  ev=cached;isAdmin=localStorage.getItem(adminFlagKey(id))==='1';
  $('create').classList.add('hidden');$('admin').classList.remove('hidden');renderAdmin();
  alert('目前無法讀取雲端，先開啟這支手機最後保留的版本。');
}
let pendingDeleteId='';
function requestDeleteSavedEvent(id){
  const cached=events()[id];
  if(!cached)return alert('找不到這場賽事的本機資料。');
  pendingDeleteId=id;
  const modal=$('deleteConfirmModal'),text=$('deleteConfirmText'),ok=$('deleteOkBtn');
  if(cached.testOnly){
    text.innerHTML='這會刪除這支手機上的<strong>測試賽事</strong>。<br>這場沒有雲端資料。';
    ok.textContent='刪除本機';
  }else{
    text.innerHTML='這會<strong>永久刪除雲端賽事</strong>，包含 Firebase 上的賽程、管理員與驗證碼資料。<br><br>此動作無法復原。';
    ok.textContent='刪除雲端';
  }
  modal.classList.remove('hidden');
}
function closeDeleteConfirm(){
  pendingDeleteId='';
  $('deleteConfirmModal')?.classList.add('hidden');
}
async function deleteSavedEvent(id){
  const all=events(),cached=all[id];
  if(!cached)return alert('找不到這場賽事的本機資料。');

  if(cached.testOnly){
    unmarkEventSaved(id);
    delete all[id];
    localStorage.setItem(STORE,JSON.stringify(all));
    if(localStorage.getItem(CURRENT)===id)localStorage.removeItem(CURRENT);
    closeDeleteConfirm();
    renderSavedEvents();
    return;
  }

  try{
    const ok=await initCloud();
    if(!ok)return alert('目前無法連上 Firebase，請稍後再試。');

    const adminSnap=await fbDb.ref(`admins/${id}/${fbUser.uid}`).once('value');
    if(!adminSnap.exists()){
      return alert('這支手機目前沒有這場賽事的管理權，無法刪除雲端資料。');
    }

    await fbDb.ref(`events/${id}`).remove();
    await fbDb.ref(`secrets/${id}`).remove();
    await fbDb.ref(`admins/${id}`).remove();

    unmarkEventSaved(id);
    delete all[id];
    localStorage.setItem(STORE,JSON.stringify(all));
    localStorage.removeItem(adminFlagKey(id));
    localStorage.removeItem(adminCodeKey(id));
    if(localStorage.getItem(CURRENT)===id)localStorage.removeItem(CURRENT);

    closeDeleteConfirm();
    renderSavedEvents();
    alert('雲端賽事已刪除。');
  }catch(e){
    console.error('deleteSavedEvent failed',e);
    alert('刪除雲端賽事失敗：'+(e?.message||e));
  }
}

function firebaseConfigured(){return !Object.values(FIREBASE_CONFIG).some(v=>String(v).includes('PASTE_'))}
async function initCloud(){
  if(cloudReady){
    fbUser=fbAuth?.currentUser||fbUser;
    return true;
  }
  if(!firebaseConfigured())return false;
  try{
    fbApp=firebase.apps.length?firebase.app():firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth=firebase.auth();fbDb=firebase.database();
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(!fbAuth.currentUser)await fbAuth.signInAnonymously();
    fbUser=fbAuth.currentUser;
    fbAuth.onAuthStateChanged(u=>{
      fbUser=u||null;
      renderHeaderAuth();
      if($('home')&&!$('home').classList.contains('hidden'))renderHomeSelections();
    });
    cloudReady=true;return true;
  }catch(e){console.error(e);alert('Firebase 連線失敗：'+e.message);return false}
}
function localEventSave(){
  let x=events();x[ev.id]=ev;localStorage.setItem(STORE,JSON.stringify(x));localStorage.setItem(CURRENT,ev.id);
  if((ev&&ev.testOnly) || savedEventIds().includes(ev.id))markEventSaved(ev.id);
}
function put(){
  localEventSave();renderAdmin();
  if(ev?.testOnly)return;
  if(cloudReady&&ev?.id&&isAdmin){
    fbDb.ref(`events/${ev.id}`).set(ev).catch(e=>alert('雲端同步失敗：'+e.message));
  }
}
function adminFlagKey(id){return `bx_cloud_admin_${id}`}
function adminCodeKey(id){return `bx_cloud_admin_code_${id}`}
async function refreshAdminState(id){
  isAdmin=false;
  if(!cloudReady||!fbUser)return false;
  try{
    const s=await fbDb.ref(`admins/${id}/${fbUser.uid}`).once('value');
    isAdmin=s.exists();
    if(isAdmin)localStorage.setItem(adminFlagKey(id),'1'); else localStorage.removeItem(adminFlagKey(id));
  }catch(e){console.warn(e)}
  return isAdmin;
}
function listenCloudEvent(id){
  if(!cloudReady)return;
  if(cloudUnsub)cloudUnsub();
  const ref=fbDb.ref(`events/${id}`);
  const cb=s=>{
    if(!s.exists())return;
    ev=s.val();localEventSave();
    $('home').classList.add('hidden');$('create').classList.add('hidden');$('admin').classList.remove('hidden');
    renderAdmin();
  };
  ref.on('value',cb);
  cloudUnsub=()=>ref.off('value',cb);
}
async function loadCloudEvent(id){
  if(!(await initCloud()))return false;
  const s=await fbDb.ref(`events/${id}`).once('value');
  if(!s.exists())return false;
  ev=s.val();await refreshAdminState(id);listenCloudEvent(id);
  $('home').classList.add('hidden');$('create').classList.add('hidden');$('admin').classList.remove('hidden');
  renderAdmin();
  if(new URLSearchParams(location.search).get('admin')==='1')showTab('organizer');
  return true;
}
function goHome(){
  ev=null;if(cloudUnsub){cloudUnsub();cloudUnsub=null}
  ['create','admin'].forEach(x=>$(x).classList.add('hidden'));$('home').classList.remove('hidden');
  history.replaceState(null,'',location.pathname);
  renderHeaderAuth();renderHomeSelections();renderSavedEvents();
}

function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function createTournament(){
 let r=rosterFromText(); if(r.length<2)return alert('至少需要 2 位參賽者。');
 const testOnly=draftStorage==='test';
 let pairing=$('pairMode').value; if(pairing==='random')r=shuffle(r);

 if(testOnly){
   ev={id:'TEST-'+uid(),name:$('eventName').value.trim()||'Beyblade X Tournament',mode:draftMode,pairing,freeFinal:$('freeFinal').value,roster:r,rounds:[],finalRR:null,created:Date.now(),testOnly:true,cloudVersion:0};
   buildFirst();
   isAdmin=true;
   localEventSave();
   markEventSaved(ev.id);
   $('create').classList.add('hidden');$('admin').classList.remove('hidden');
   history.replaceState(null,'',location.pathname);
   renderAdmin();
   return;
 }

 if(!(await initCloud()))return alert('Firebase 尚未連線成功。');
 if(!isGoogleUser())return alert('建立雲端賽事前，必須先使用 Google 帳號登入。');
 fbUser=fbAuth.currentUser;
 ev={id:uid(),name:$('eventName').value.trim()||'Beyblade X Tournament',mode:draftMode,pairing,freeFinal:$('freeFinal').value,roster:r,rounds:[],finalRR:null,created:Date.now(),cloudVersion:3,ownerUid:fbUser.uid,ownerEmail:fbUser.email||'',ownerName:fbUser.displayName||'',testOnly:false};
 buildFirst();
 const code=String(Math.floor(100000+Math.random()*900000));
 try{
   await fbDb.ref(`events/${ev.id}`).set(ev);
   await fbDb.ref(`secrets/${ev.id}/adminCode`).set(code);
   await fbDb.ref(`admins/${ev.id}/${fbUser.uid}`).set(code);
   isAdmin=true;
   localStorage.setItem(adminFlagKey(ev.id),'1');
   localStorage.setItem(adminCodeKey(ev.id),code);
   listenCloudEvent(ev.id);
   history.replaceState(null,'',`${location.pathname}?event=${encodeURIComponent(ev.id)}`);
   $('create').classList.add('hidden');$('admin').classList.remove('hidden');
   localEventSave();renderAdmin();
 }catch(e){
   console.error('createTournament cloud bootstrap failed',e);
   alert('建立雲端賽事失敗：'+e.message+'\n\n請確認 Firebase「規則」已發布。');
 }
}
function nextPow2(n){let p=1;while(p<n)p*=2;return p}
function buildFirst(){
 let r=[...ev.roster], slots=[];
 if(ev.mode==='single'){
   let p=nextPow2(r.length), byes=p-r.length;
   // distribute BYEs by pairing a player with BYE first, then normal pairs
   let idx=0; for(let i=0;i<byes;i++)slots.push(match(r[idx++],'BYE'));
   while(idx<r.length){slots.push(match(r[idx++],r[idx++]||'BYE'))}
 } else {
   for(let i=0;i<r.length;i+=2)slots.push(match(r[i],r[i+1]||'BYE'));
 }
 autoByes(slots); ev.rounds=[{name:'第 1 輪',matches:slots}]
}
function match(a,b){return {a:a||'BYE',b:b||'BYE',sa:'',sb:'',winner:null,referee:'',refereeActive:false}}
function autoByes(ms){ms.forEach(m=>{if(m.a==='BYE'&&m.b!=='BYE')m.winner=m.b;if(m.b==='BYE'&&m.a!=='BYE')m.winner=m.a})}
function winners(r){return r.matches.map(m=>m.winner).filter(Boolean)}
function complete(r){return r.matches.every(m=>m.winner)}
function ensureNext(){
 let last=ev.rounds.at(-1); if(!complete(last)||ev.finalRR)return;
 let w=winners(last);
 if(ev.mode==='free'&&ev.freeFinal==='rr3'&&w.length===3){ev.finalRR={players:w,matches:[match(w[0],w[1]),match(w[1],w[2]),match(w[0],w[2])]};return}
 if(w.length===1)return;
 let ms=[];for(let i=0;i<w.length;i+=2)ms.push(match(w[i],w[i+1]||'BYE'));autoByes(ms);ev.rounds.push({name:`第 ${ev.rounds.length+1} 輪`,matches:ms});
 if(complete(ev.rounds.at(-1)))ensureNext()
}

function drawBracketLinks(){
  const canvas=document.querySelector('.bracketCanvas'),svg=document.querySelector('.bracketLinks');if(!canvas||!svg)return;
  const cr=canvas.getBoundingClientRect();
  svg.setAttribute('width',canvas.scrollWidth);svg.setAttribute('height',canvas.scrollHeight);svg.setAttribute('viewBox',`0 0 ${canvas.scrollWidth} ${canvas.scrollHeight}`);
  let paths=[];
  for(let ri=0;ri<ev.rounds.length-1;ri++){
    const src=[...canvas.querySelectorAll(`.bracketMatch[data-ri="${ri}"]`)];
    const dst=[...canvas.querySelectorAll(`.bracketMatch[data-ri="${ri+1}"]`)];
    dst.forEach((d,j)=>{
      const dr=d.getBoundingClientRect(), tx=(dr.left-cr.left)/bracketScale, ty=(dr.top-cr.top+dr.height/2)/bracketScale;
      [src[j*2],src[j*2+1]].filter(Boolean).forEach(a=>{
        const ar=a.getBoundingClientRect(), sx=(ar.right-cr.left)/bracketScale, sy=(ar.top-cr.top+ar.height/2)/bracketScale, mx=(sx+tx)/2;
        const live=a.classList.contains('done')?' live':'';
        paths.push(`<path class="${live.trim()}" d="M ${sx} ${sy} H ${mx} V ${ty} H ${tx}"/>`);
      });
    });
  }
  if(ev.finalRR){
    const last=ev.rounds.length-1, src=[...canvas.querySelectorAll(`.bracketMatch[data-ri="${last}"]`)], target=canvas.querySelector('.rrPanel');
    if(target){const tr=target.getBoundingClientRect(),tx=(tr.left-cr.left)/bracketScale,ty=(tr.top-cr.top+60)/bracketScale;src.forEach((a,k)=>{const ar=a.getBoundingClientRect(),sx=(ar.right-cr.left)/bracketScale,sy=(ar.top-cr.top+ar.height/2)/bracketScale,mx=(sx+tx)/2;paths.push(`<path d="M ${sx} ${sy} H ${mx} V ${ty+k*12} H ${tx}"/>`)})}
  }

}
function normalizeEvent(){

}

function renderRoster(){
 $('rosterTab').innerHTML=`<div class=card><h3>編輯參賽名單</h3><div class=notice>對戰表建立後修改姓名會同步改名；新增／刪除選手會影響籤表，因此目前只允許在尚未有比賽結果時重建。</div><div id=editRoster>${ev.roster.map((n,i)=>`<div class=player><span class=num>${i+1}</span><input value="${esc(n)}" onchange="rename(${i},this.value)"><button class="mini danger" onclick="delPlayer(${i})">刪</button></div>`).join('')}</div><div class=row><input id=newPlayer placeholder="新增選手"><button onclick=addPlayer()>＋新增</button></div><div class=toolbar style="margin-top:10px"><button class=secondary onclick=rebuild()>依目前名單重建籤表</button><button class=secondary onclick=randomRebuild()>🎲 抽籤重建</button></div></div>`
}
function noResults(){return ev.rounds.every(r=>r.matches.every(m=>!m.winner||m.a==='BYE'||m.b==='BYE'))&&!ev.finalRR}
function rename(i,v){let old=ev.roster[i],nv=v.trim()||old;ev.roster[i]=nv;ev.rounds.forEach(r=>r.matches.forEach(m=>{if(m.a===old)m.a=nv;if(m.b===old)m.b=nv;if(m.winner===old)m.winner=nv}));if(ev.finalRR){ev.finalRR.players=ev.finalRR.players.map(x=>x===old?nv:x);ev.finalRR.matches.forEach(m=>{if(m.a===old)m.a=nv;if(m.b===old)m.b=nv;if(m.winner===old)m.winner=nv})}put()}
function delPlayer(i){if(!noResults())return alert('已有比賽結果，請先重設／重建後再刪除。');ev.roster.splice(i,1);rebuild()}
function addPlayer(){let v=$('newPlayer').value.trim();if(!v)return; if(!noResults())return alert('已有比賽結果，請先重設／重建後再新增。');ev.roster.push(v);rebuild()}
function rebuild(){ev.rounds=[];ev.finalRR=null;buildFirst();put()}
function randomRebuild(){ev.roster=shuffle(ev.roster);ev.pairing='random';rebuild()}
function showTab(t){['bracket','roster','referee','organizer','share'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==t))}
function renderShare(){
 if(ev?.testOnly){
   $('shareTab').innerHTML=`<div class=card><h3>QR／分享</h3><div class=notice>這場是本機測試賽事，沒有雲端網址，因此不提供 QR 分享或跨手機同步。</div></div>`;
   return;
 }
 $('shareTab').innerHTML=`<div class=card><h3>QR／分享</h3><div class=notice>這是公開觀看連結。觀眾可以即時看到比分與晉級，但沒有管理權。</div><label>公開觀看網址</label><input id=pubUrl readonly value="${esc(publicUrl())}"><div id=qr class=qrbox></div><div class=toolbar><button onclick=copyPublic()>複製連結</button><button class=secondary onclick=nativeShare()>分享到 LINE／其他 App</button></div></div>`;
 setTimeout(()=>{let q=$('qr');q.innerHTML='';if(window.QRCode)new QRCode(q,{text:publicUrl(),width:180,height:180})},0)
}
async function copyPublic(){await navigator.clipboard.writeText(publicUrl());alert('已複製連結')}
async function nativeShare(){if(navigator.share)await navigator.share({title:ev.name,text:'查看即時對戰表',url:publicUrl()});else copyPublic()}
function showTab(t){['bracket','roster','referee','organizer','share'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==t))}

window.addEventListener('resize',()=>{clearTimeout(window.__bxResize);window.__bxResize=setTimeout(()=>{setBracketScale(bracketScale);drawBracketLinks()},120)});


$('deleteCancelBtn')?.addEventListener('click',closeDeleteConfirm);
$('deleteOkBtn')?.addEventListener('click',async()=>{
  if(!pendingDeleteId)return closeDeleteConfirm();
  const btn=$('deleteOkBtn');
  btn.disabled=true;
  const old=btn.textContent;
  btn.textContent='刪除中…';
  try{await deleteSavedEvent(pendingDeleteId)}
  finally{btn.disabled=false;btn.textContent=old}
});
$('deleteConfirmModal')?.addEventListener('click',e=>{
  if(e.target===$('deleteConfirmModal'))closeDeleteConfirm();
});

(async function bootstrapCloud(){
  draftStorage=localStorage.getItem(KEEP)==='1'?'test':'cloud';
  await initCloud();
  fbUser=fbAuth?.currentUser||fbUser;
  renderHeaderAuth();renderHomeSelections();renderSavedEvents();
  const p=new URLSearchParams(location.search),id=p.get('event');
  if(id){
    const ok=await loadCloudEvent(id);
    if(!ok){
      const cached=events()[id];
      if(cached){
        ev=cached;isAdmin=localStorage.getItem(adminFlagKey(id))==='1';
        $('home').classList.add('hidden');$('create').classList.add('hidden');$('admin').classList.remove('hidden');renderAdmin();
        alert('雲端暫時無法讀取，已開啟本機最後保留版本。');
      }else alert('找不到這個雲端賽事，或目前沒有讀取權限。');
    }
  }
})();
</script>
