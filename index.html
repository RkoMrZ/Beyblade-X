<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><title>Beyblade X Tournament</title>
<style>
:root{--bg:#0b0d12;--panel:#151922;--panel2:#1c2230;--line:#303849;--text:#f7f8fa;--muted:#98a2b3;--accent:#ff5a3c;--green:#2dcf7d;--blue:#56a8ff;--warn:#f4c84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
header{position:sticky;top:0;z-index:10;background:#0b0d12eF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:920px;margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}
main{padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}.hero{padding:22px}.hero h2{font-size:26px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer}.mode:hover{border-color:#657089}.mode h3{margin:8px 0}.icon{font-size:30px}
button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.secondary{background:var(--panel2);border:1px solid var(--line)}.ghost{background:transparent;border:1px solid var(--line)}.danger{background:#3a1717;color:#ffb1a5;border:1px solid #71302a}
input,select,textarea{width:100%;background:#0f131b;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 12px}.tab{white-space:nowrap;background:var(--panel2);border:1px solid var(--line)}.tab.active{background:var(--accent);border-color:var(--accent)}
.player{display:flex;gap:8px;align-items:center;background:var(--panel2);padding:8px;border-radius:11px;margin:6px 0}.num{width:30px;color:var(--muted);text-align:center}.player input{padding:8px}.player .mini{padding:8px 10px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#252c39;color:#cbd5e1;font-size:12px;margin:2px}
.stageTitle{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}.stageTitle h3{margin:0}.match{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.match.done{border-color:#236c4b}.matchNo{color:var(--muted);font-size:12px;margin-bottom:7px}
.side{display:grid;grid-template-columns:1fr 64px 42px;gap:7px;align-items:center;margin:5px 0}.side.winner{background:#143224;border-radius:9px;padding:4px}.score{text-align:center}.winbtn{padding:9px;background:#273040;border:1px solid var(--line)}.winbtn.on{background:var(--green);color:#07140d}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:120px}.hidden{display:none!important}.notice{background:#2a2515;border:1px solid #665b27;color:#f5df86;padding:11px;border-radius:11px;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--muted)}
.qrbox{background:white;border-radius:14px;padding:12px;width:max-content;margin:14px auto}.center{text-align:center}.spacer{height:6px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.hero h2{font-size:22px}main{padding:10px}.card{padding:13px}.side{grid-template-columns:1fr 54px 38px}}
</style>
</head>
<body>
<header><div class="wrap brand"><div><h1>⚔️ Beyblade X Tournament</h1><small id="headSub">自由編排・單淘汰</small></div><button class="ghost" id="homeBtn" onclick="goHome()">首頁</button></div></header>
<main class="wrap">
<section id="home">
 <div class="card hero"><h2>建立新賽事</h2><div class="muted">先選賽制，之後可編輯名單、選擇依序／抽籤／手動配對。</div></div>
 <div class="grid2">
  <div class="mode" onclick="startCreate('free')"><div class="icon">🛠️</div><h3>自由編排</h3><div class="muted">自訂人數與階段。適合 24→12→6→3，最後三人循環等特殊賽制。</div></div>
  <div class="mode" onclick="startCreate('single')"><div class="icon">🏆</div><h3>單淘汰賽</h3><div class="muted">標準淘汰樹。非 2 次方人數自動安排 BYE，直到冠軍。</div></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>本機賽事</h3><div id="savedList" class="muted">尚無賽事</div></div>
</section>

<section id="create" class="hidden">
 <div class="card"><h2 id="createTitle">建立賽事</h2>
  <label>賽事名稱</label><input id="eventName" placeholder="例如：Beyblade X 秋季盃">
  <label>配對方式</label><select id="pairMode"><option value="ordered">依序配對</option><option value="random">隨機抽籤</option><option value="manual">手動編排（建立後可交換）</option></select>
  <div id="freeOpts" class="hidden"><label>自由編排目標</label><select id="freeFinal"><option value="rr3">一路兩兩淘汰，剩 3 人後三人循環</option><option value="champ">一路兩兩淘汰至冠軍</option></select></div>
  <label>參賽名單（每行一位）</label><textarea id="bulkNames" rows="10" placeholder="王小明&#10;陳小華&#10;選手 C"></textarea>
  <div class="row"><button class="secondary" onclick="makeDemo()">產生測試名單</button><input id="demoCount" type="number" min="2" value="24" style="max-width:95px"></div>
 </div>
 <div class="card"><div class="row"><h3 style="margin:0">名單預覽</h3><span id="countBadge" class="badge">0 人</span></div><div id="rosterPreview" class="muted">輸入名單後會顯示在這裡。</div>
  <div class="toolbar" style="margin-top:12px"><button class="secondary" onclick="shuffleRoster()">🎲 隨機排序</button><button onclick="createEvent()">建立對戰表</button></div>
 </div>
</section>

<section id="admin" class="hidden">
 <div class="card"><div class="row"><div><h2 id="adminTitle" style="margin:0"></h2><div id="eventMeta" class="muted"></div></div></div>
  <div class="toolbar" style="margin-top:12px"><button onclick="showTab('bracket')">對戰表</button><button class="secondary" onclick="showTab('roster')">參賽名單</button><button class="secondary" onclick="showTab('share')">QR／分享</button></div>
 </div>
 <div id="bracketTab"></div>
 <div id="rosterTab" class="hidden"></div>
 <div id="shareTab" class="hidden"></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const STORE='bx_events_v2', CURRENT='bx_current_v2'; let draftMode='free', ev=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function events(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return {}}}
function put(){let x=events();x[ev.id]=ev;localStorage.setItem(STORE,JSON.stringify(x));localStorage.setItem(CURRENT,ev.id);renderAdmin()}
function goHome(){ev=null;['create','admin'].forEach(x=>$(x).classList.add('hidden'));$('home').classList.remove('hidden');renderSaved()}
function startCreate(m){draftMode=m;$('home').classList.add('hidden');$('create').classList.remove('hidden');$('createTitle').textContent=m==='free'?'建立自由編排賽事':'建立單淘汰賽';$('freeOpts').classList.toggle('hidden',m!=='free');updatePreview()}
$('bulkNames').addEventListener('input',updatePreview);
function rosterFromText(){return $('bulkNames').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean)}
function updatePreview(){let a=rosterFromText();$('countBadge').textContent=a.length+' 人';$('rosterPreview').innerHTML=a.length?a.map((n,i)=>`<div class="player"><span class="num">${i+1}</span><span>${esc(n)}</span></div>`).join(''):'輸入名單後會顯示在這裡。'}
function makeDemo(){let n=Math.max(2,+$('demoCount').value||24);$('bulkNames').value=Array.from({length:n},(_,i)=>`選手 ${i+1}`).join('\n');updatePreview()}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleRoster(){$('bulkNames').value=shuffle(rosterFromText()).join('\n');updatePreview()}
function uid(){return Math.random().toString(36).slice(2,9).toUpperCase()}
function createEvent(){
 let r=rosterFromText(); if(r.length<2)return alert('至少需要 2 位參賽者。');
 let pairing=$('pairMode').value; if(pairing==='random')r=shuffle(r);
 ev={id:uid(),name:$('eventName').value.trim()||'Beyblade X Tournament',mode:draftMode,pairing,freeFinal:$('freeFinal').value,roster:r,rounds:[],finalRR:null,created:Date.now()};
 buildFirst(); $('create').classList.add('hidden');$('admin').classList.remove('hidden');put()
}
function nextPow2(n){let p=1;while(p<n)p*=2;return p}
function buildFirst(){
 let r=[...ev.roster], slots=[];
 if(ev.mode==='single'){
   let p=nextPow2(r.length), byes=p-r.length;
   // distribute BYEs by pairing a player with BYE first, then normal pairs
   let idx=0; for(let i=0;i<byes;i++)slots.push(match(r[idx++],'BYE'));
   while(idx<r.length){slots.push(match(r[idx++],r[idx++]||'BYE'))}
 } else {
   for(let i=0;i<r.length;i+=2)slots.push(match(r[i],r[i+1]||'BYE'));
 }
 autoByes(slots); ev.rounds=[{name:'第 1 輪',matches:slots}]
}
function match(a,b){return {a:a||'BYE',b:b||'BYE',sa:'',sb:'',winner:null}}
function autoByes(ms){ms.forEach(m=>{if(m.a==='BYE'&&m.b!=='BYE')m.winner=m.b;if(m.b==='BYE'&&m.a!=='BYE')m.winner=m.a})}
function winners(r){return r.matches.map(m=>m.winner).filter(Boolean)}
function complete(r){return r.matches.every(m=>m.winner)}
function ensureNext(){
 let last=ev.rounds.at(-1); if(!complete(last)||ev.finalRR)return;
 let w=winners(last);
 if(ev.mode==='free'&&ev.freeFinal==='rr3'&&w.length===3){ev.finalRR={players:w,matches:[match(w[0],w[1]),match(w[1],w[2]),match(w[0],w[2])]};return}
 if(w.length===1)return;
 let ms=[];for(let i=0;i<w.length;i+=2)ms.push(match(w[i],w[i+1]||'BYE'));autoByes(ms);ev.rounds.push({name:`第 ${ev.rounds.length+1} 輪`,matches:ms});
 if(complete(ev.rounds.at(-1)))ensureNext()
}
function pick(ri,mi,side){
 let m=ev.rounds[ri].matches[mi],v=side==='a'?m.a:m.b;if(v==='BYE')return;m.winner=v;put();ensureNext();put()
}
function score(ri,mi){
 let m=ev.rounds[ri].matches[mi],a=$(`s${ri}-${mi}a`).value,b=$(`s${ri}-${mi}b`).value;if(a===''||b===''||+a===+b)return alert('請輸入不同的比分。');
 m.sa=a;m.sb=b;m.winner=+a>+b?m.a:m.b;put();ensureNext();put()
}
function resetMatch(ri,mi){
 ev.rounds=ev.rounds.slice(0,ri+1);ev.finalRR=null;let m=ev.rounds[ri].matches[mi];m.winner=null;m.sa='';m.sb='';put()
}
function swapPlayers(ri,i,j){
 if(i<0||j<0)return;let r=ev.rounds[ri]; if(r.matches.some(m=>m.winner))return alert('本輪已有結果，請先重設再調整。');
 let flat=r.matches.flatMap(m=>[m.a,m.b]);[flat[i],flat[j]]=[flat[j],flat[i]];r.matches=Array.from({length:Math.ceil(flat.length/2)},(_,k)=>match(flat[k*2],flat[k*2+1]));autoByes(r.matches);put()
}
function rrScore(i){let m=ev.finalRR.matches[i],a=$(`rr${i}a`).value,b=$(`rr${i}b`).value;if(a===''||b===''||+a===+b)return alert('請輸入不同的比分。');m.sa=a;m.sb=b;m.winner=+a>+b?m.a:m.b;put()}
function renderAdmin(){
 $('adminTitle').textContent=ev.name;$('eventMeta').innerHTML=`<span class=badge>${ev.mode==='free'?'自由編排':'單淘汰'}</span><span class=badge>${ev.roster.length} 人</span><span class=badge>${ev.pairing==='random'?'抽籤':ev.pairing==='manual'?'手動':'依序'}</span>`;
 let html='';
 ev.rounds.forEach((r,ri)=>{html+=`<div class=stageTitle><h3>${r.name}</h3><span class=badge>${r.matches.length} 場</span></div>`;
 r.matches.forEach((m,mi)=>{html+=`<div class="match ${m.winner?'done':''}"><div class=matchNo>第 ${mi+1} 場</div>
 <div class="side ${m.winner===m.a?'winner':''}"><span>${esc(m.a)}</span><input class=score id="s${ri}-${mi}a" inputmode=numeric value="${m.sa}"><button class="winbtn ${m.winner===m.a?'on':''}" onclick="pick(${ri},${mi},'a')">勝</button></div>
 <div class="side ${m.winner===m.b?'winner':''}"><span>${esc(m.b)}</span><input class=score id="s${ri}-${mi}b" inputmode=numeric value="${m.sb}"><button class="winbtn ${m.winner===m.b?'on':''}" onclick="pick(${ri},${mi},'b')">勝</button></div>
 <div class=toolbar><button class=secondary onclick="score(${ri},${mi})">記錄比分</button><button class=danger onclick="resetMatch(${ri},${mi})">重設</button></div></div>`});
 if(ri===0&&ev.pairing==='manual'&&!r.matches.some(m=>m.winner)){let n=r.matches.length*2;html+=`<div class=card><b>手動交換位置</b><div class=muted>輸入兩個順位後交換，例如 1 與 8。</div><div class=row style="margin-top:8px"><input id=swapA type=number min=1 max=${n} placeholder=順位1><input id=swapB type=number min=1 max=${n} placeholder=順位2><button onclick="swapPlayers(0,+swapA.value-1,+swapB.value-1)">交換</button></div></div>`}
 });
 if(ev.finalRR)html+=renderRR();
 let last=ev.rounds.at(-1);if(last&&complete(last)&&winners(last).length===1)html+=`<div class=card><h2>🏆 冠軍：${esc(winners(last)[0])}</h2></div>`;
 $('bracketTab').innerHTML=html;renderRoster();renderShare()
}
function renderRR(){let f=ev.finalRR,h=`<div class=stageTitle><h3>🏆 最後三人循環</h3><span class=badge>3 場</span></div>`;
 f.matches.forEach((m,i)=>h+=`<div class="match ${m.winner?'done':''}"><div class=matchNo>循環賽 ${i+1}</div><div class=side><span>${esc(m.a)}</span><input class=score id="rr${i}a" value="${m.sa}" inputmode=numeric><span></span></div><div class=side><span>${esc(m.b)}</span><input class=score id="rr${i}b" value="${m.sb}" inputmode=numeric><span></span></div><button onclick="rrScore(${i})">記錄比分</button></div>`);
 let rows=f.players.map(p=>({p,w:f.matches.filter(m=>m.winner===p).length,l:f.matches.filter(m=>m.winner&&m.winner!==p&&(m.a===p||m.b===p)).length})).sort((a,b)=>b.w-a.w);
 h+=`<div class=card><h3>循環排名</h3><table><tr><th>#</th><th>選手</th><th>勝</th><th>負</th></tr>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.p)}</td><td>${x.w}</td><td>${x.l}</td></tr>`).join('')}</table></div>`;return h}
function renderRoster(){
 $('rosterTab').innerHTML=`<div class=card><h3>編輯參賽名單</h3><div class=notice>對戰表建立後修改姓名會同步改名；新增／刪除選手會影響籤表，因此目前只允許在尚未有比賽結果時重建。</div><div id=editRoster>${ev.roster.map((n,i)=>`<div class=player><span class=num>${i+1}</span><input value="${esc(n)}" onchange="rename(${i},this.value)"><button class="mini danger" onclick="delPlayer(${i})">刪</button></div>`).join('')}</div><div class=row><input id=newPlayer placeholder="新增選手"><button onclick=addPlayer()>＋新增</button></div><div class=toolbar style="margin-top:10px"><button class=secondary onclick=rebuild()>依目前名單重建籤表</button><button class=secondary onclick=randomRebuild()>🎲 抽籤重建</button></div></div>`
}
function noResults(){return ev.rounds.every(r=>r.matches.every(m=>!m.winner||m.a==='BYE'||m.b==='BYE'))&&!ev.finalRR}
function rename(i,v){let old=ev.roster[i],nv=v.trim()||old;ev.roster[i]=nv;ev.rounds.forEach(r=>r.matches.forEach(m=>{if(m.a===old)m.a=nv;if(m.b===old)m.b=nv;if(m.winner===old)m.winner=nv}));if(ev.finalRR){ev.finalRR.players=ev.finalRR.players.map(x=>x===old?nv:x);ev.finalRR.matches.forEach(m=>{if(m.a===old)m.a=nv;if(m.b===old)m.b=nv;if(m.winner===old)m.winner=nv})}put()}
function delPlayer(i){if(!noResults())return alert('已有比賽結果，請先重設／重建後再刪除。');ev.roster.splice(i,1);rebuild()}
function addPlayer(){let v=$('newPlayer').value.trim();if(!v)return; if(!noResults())return alert('已有比賽結果，請先重設／重建後再新增。');ev.roster.push(v);rebuild()}
function rebuild(){ev.rounds=[];ev.finalRR=null;buildFirst();put()}
function randomRebuild(){ev.roster=shuffle(ev.roster);ev.pairing='random';rebuild()}
function showTab(t){['bracket','roster','share'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==t))}
function publicUrl(){return location.origin+location.pathname+'?view='+ev.id}
function renderShare(){
 $('shareTab').innerHTML=`<div class=card><h3>QR／分享</h3><div class=notice>目前 GitHub Pages V2 為本機資料版：QR 與分享介面已完成，但跨手機即時同步要接雲端資料庫後才會正式啟用。</div><label>預計公開觀看網址</label><input id=pubUrl readonly value="${esc(publicUrl())}"><div id=qr class=qrbox></div><div class=toolbar><button onclick=copyPublic()>複製連結</button><button class=secondary onclick=nativeShare()>分享到 LINE／其他 App</button></div></div>`;
 setTimeout(()=>{let q=$('qr');q.innerHTML='';if(window.QRCode)new QRCode(q,{text:publicUrl(),width:180,height:180})},0)
}
async function copyPublic(){await navigator.clipboard.writeText(publicUrl());alert('已複製連結')}
async function nativeShare(){if(navigator.share)await navigator.share({title:ev.name,text:'查看即時對戰表',url:publicUrl()});else copyPublic()}
function showTab(t){['bracket','roster','share'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==t))}
function renderSaved(){let x=events(),ids=Object.keys(x);$('savedList').innerHTML=ids.length?ids.map(id=>`<div class=player><span style="flex:1"><b>${esc(x[id].name)}</b><br><span class=muted>${x[id].roster.length} 人・${x[id].mode==='free'?'自由編排':'單淘汰'}</span></span><button onclick="openEvent('${id}')">開啟</button></div>`).join(''):'尚無賽事'}
function openEvent(id){ev=events()[id];if(!ev)return;$('home').classList.add('hidden');$('create').classList.add('hidden');$('admin').classList.remove('hidden');renderAdmin()}
renderSaved();
</script>
</body></html>
