<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>公開審核查詢</title><meta name="theme-color" content="#0b0d12"><script>try{document.documentElement.dataset.theme=localStorage.getItem('bx_live_theme')==='light'?'light':'dark'}catch{}</script><style>:root{color-scheme:dark;--bg:#0b0d12;--panel:#151922;--panel2:#1c2230;--line:#303849;--text:#f7f8fa;--muted:#98a2b3;--accent:#ff5a3c;--green:#2dcf7d;--warn:#f4c84b;--red:#ffb1a5;--input:#0f131b}
:root[data-theme=light]{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--panel2:#f1f4f8;--line:#d7dde7;--text:#18212f;--muted:#687386;--accent:#ff5a3c;--green:#15965a;--warn:#a87400;--red:#b6442d;--input:#fff}
*{box-sizing:border-box}html,body{min-width:0;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{min-height:100dvh}button,input{font:inherit}button{min-height:39px;padding:8px 12px;background:var(--accent);border:1px solid transparent;color:#fff;border-radius:10px;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.alt{background:var(--panel2);color:var(--text);border-color:var(--line)}button.good{background:#163a2a;color:#9ce7b9;border-color:#28734e}button.bad{background:#3d1d1d;color:#ffbdad;border-color:#813d33}button.sm{font-size:13px;padding:6px 9px;min-height:32px}input{min-width:0;width:100%;padding:10px 12px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:16px}input:focus{outline:2px solid var(--accent);outline-offset:1px}label{display:block;color:var(--muted);font-size:13px;margin:11px 0 5px}a{color:var(--accent)}p{line-height:1.55}.muted{color:var(--muted)}.tiny{font-size:12px}.header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:var(--bg)}.top{width:min(1280px,100%);margin:auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.actions>button{white-space:nowrap}.container{max-width:1280px;margin:auto;padding:24px 14px 64px}h1{font-size:clamp(23px,3vw,32px);margin:0 0 12px}h2{font-size:20px;margin:0 0 12px}.card{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px;margin-bottom:13px;min-width:0}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.stack{display:grid;gap:10px}.dim{font-size:13px;color:var(--muted)}.status{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:13px;margin:10px 0}.status.ok{color:var(--green)}.status.warn{color:var(--warn)}.status.err{color:var(--red)}.pill{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;white-space:nowrap}.pill.pending{color:var(--warn)}.pill.approved{color:var(--green)}.pill.rejected{color:var(--red)}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.full{grid-column:1/-1}.formBtns{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap}.formBtns>*{flex:1}.tableWrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th{background:var(--panel2);white-space:nowrap;color:var(--muted)}.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}.tabbar button{min-width:0;padding:7px 2px;font-size:12px}.tabbar button[aria-selected=true]{background:var(--accent);color:#fff}.tabbar button:not([aria-selected=true]){background:var(--panel2);color:var(--muted);border-color:var(--line)}.contact{font-weight:800}.contact small{display:block;color:var(--muted);font-weight:450;margin-top:4px}.rank{white-space:nowrap;font-weight:800}.sheetWrap{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px}.sheet{width:min(470px,100%);background:var(--panel);padding:20px;border:1px solid var(--line);border-radius:17px;max-height:90dvh;overflow:auto}.hide{display:none!important}.msg{padding:11px 14px;border-radius:11px;background:var(--panel2);color:var(--muted);margin:10px 0}.close{width:100%;margin-top:13px}.public{max-width:790px;margin:auto}.public .card{max-width:640px}.big{font-weight:900;font-size:clamp(25px,6vw,34px);color:var(--green)}.summary{padding:12px 14px;background:var(--panel2);border-radius:12px;line-height:2}.badge{color:var(--muted);font-size:12px}
@media(max-width:650px){.container{padding:18px 11px 55px}.card{padding:15px}.formGrid{grid-template-columns:1fr}.brand{font-size:14px}.top button{font-size:12px;padding:7px 8px}.tableWrap table{min-width:415px}.reviewbtn{min-width:0!important;font-size:11px!important;padding:6px 4px!important}.sheetWrap{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;width:100%;padding:18px 17px calc(18px + env(safe-area-inset-bottom))}.tableWrap th,.tableWrap td{padding:9px 6px}.tableWrap th:first-child,.tableWrap td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:85px;max-width:105px}.tableWrap th:first-child{background:var(--panel2)}.tabbar button{font-size:11px}.tabbar{gap:4px}}
</style></head><body>
<header class="header"><div class="top"><div class="brand">戰鬥陀螺・線上報名</div><span class="pill">公開查詢</span></div></header>
<main class="container public"><h1 id="title">公開審核查詢</h1><p class="muted">依照原始報名先後計算正選／備選；待審核並不等於已通過。此頁僅讀取單場精簡名單，不下載 LINE 名稱。</p><div id="notice" class="status">正在讀取雲端資料…</div><section class="card"><div class="row between"><strong id="count">—</strong><button class="alt sm" id="refresh">立即更新</button></div><label for="search">搜尋比賽名稱或手機後三碼</label><input type="search" id="search" placeholder="搜尋…"><div class="tableWrap" style="margin-top:13px"><table><thead><tr><th>正／備選</th><th>比賽名稱</th><th>手機後三碼</th><th>審核狀態</th></tr></thead><tbody id="rows"><tr><td colspan="4">等待資料…</td></tr></tbody></table></div><p class="dim" id="last">每次先讀取精簡的變更標記；有更新才取得相關選手。</p></section></main>
<script>
'use strict';
const DB='https://ljtreg-39954-default-rtdb.asia-southeast1.firebasedatabase.app',eid=new URLSearchParams(location.search).get('event')||'', $=s=>document.getElementById(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={pending:'待審核',approved:'通過',rejected:'不通過'};
let meta=null,rows=null,requesting=false,lastUpdate=0,syncToken=null,seen=new Set();
function notice(t,bad=false){$('notice').className='status '+(bad?'warn':'ok');$('notice').textContent=t}
async function get(path,query=null){const u=new URL(DB+'/'+path+'.json');if(query)for(const [k,v] of Object.entries(query))u.searchParams.set(k,v);const c=new AbortController(),time=setTimeout(()=>c.abort(),12000);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTPS '+r.status);return await r.json()}finally{clearTimeout(time)}}
function render(){if(!meta||rows===null)return;let a=Object.values(rows).filter(x=>x&&x.status!=='deleted').sort((x,y)=>x.signupNo-y.signupNo),n=0,m=new Map();for(const r of a){if(r.status==='rejected')continue;n++;m.set(r.signupNo,n<=meta.capacity?'正選#'+n:'備選#'+(n-meta.capacity))}a.sort((x,y)=>(x.status==='rejected')-(y.status==='rejected')||x.signupNo-y.signupNo);const q=$('search').value.trim().toLowerCase(),matched=a.filter(r=>r.playerName.toLowerCase().includes(q)||r.phone3.includes(q));$('count').textContent='總報名 '+a.length+' 人 · 有效順位 '+n+' 人';$('rows').innerHTML=matched.length?matched.map(r=>`<tr><td class="rank">${safe(m.get(r.signupNo)||'—')}</td><td>${safe(r.playerName)}</td><td>${safe(r.phone3)}</td><td><span class="pill ${safe(r.status)}">${safe(names[r.status]||'未知')}</span></td></tr>`).join(''):'<tr><td colspan="4">目前沒有符合條件的報名</td></tr>';$('last').textContent='最新確認：'+new Date(lastUpdate).toLocaleTimeString('zh-TW',{hour12:false})+'；本頁只讀公開資料，不寫回雲端。'}
async function initial(){if(!/^[a-f0-9]{24}$/.test(eid)){notice('報名連結無效',true);return}if(requesting)return;requesting=true;try{const [marker,history]=await Promise.all([get('syncV8/'+eid),get('changesV8/'+eid,{'orderBy':'"$key"','limitToLast':'100'})]),[m,r]=await Promise.all([get('eventsV8/'+eid+'/meta'),get('publicRowsV8/'+eid)]);if(!m||m.deleted)throw Error('活動不存在或已刪除');meta=m;rows=r||{};syncToken=marker?.token||null;seen=new Set(Object.keys(history||{}));lastUpdate=Date.now();$('title').textContent=m.title;document.title=m.title+'｜公開查詢';render();notice('已取得正式雲端公開名單')}catch(e){notice('讀取失敗：'+e.message,true)}finally{requesting=false}}
async function checkUpdate(){if(requesting||!rows)return;requesting=true;try{const stamp=await get('syncV8/'+eid);if(!stamp){rows=null;throw Error('活動已刪除')}
 if(stamp.token===syncToken){lastUpdate=Date.now();render();notice('名單無變更，已確認');return}
 const history=await get('changesV8/'+eid,{'orderBy':'"$key"','limitToLast':'100'}),list=Object.entries(history||{}).sort((a,b)=>a[0].localeCompare(b[0])),fresh=list.filter(([id])=>!seen.has(id));
 if(list.length>=100&&!list.some(([id])=>seen.has(id))){requesting=false;return initial()}
 for(const [id,item] of fresh){seen.add(id);if(item.type==='meta'){const m=await get('eventsV8/'+eid+'/meta');if(!m||m.deleted)throw Error('活動已刪除');meta=m;continue}if(!/^p\d{8}$/.test(item.key||''))continue;const r=await get('publicRowsV8/'+eid+'/'+item.key);if(r)rows[item.key]=r;else delete rows[item.key]}
 if(seen.size>250)seen=new Set([...seen].slice(-150));syncToken=stamp.token;lastUpdate=Date.now();render();notice('已套用最新幾筆雲端變更')
 }catch(e){notice('目前無法確認最新名單：'+e.message+'；不會寫回手機舊資料',true)}finally{requesting=false}}
$('search').oninput=render;$('refresh').onclick=()=>rows?checkUpdate():initial();setInterval(()=>{if(document.visibilityState==='visible')checkUpdate()},45000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});window.addEventListener('pageshow',e=>{if(e.persisted)checkUpdate()});initial();
</script></body></html>
