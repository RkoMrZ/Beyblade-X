<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17152e">
<title>比賽線上報名平台</title>
<style>
:root{color-scheme:dark;--bg:#101122;--surface:#1d2035;--surface2:#292c45;--line:#3a3e58;--ink:#f4f5ff;--muted:#a9b1ce;--accent:#aa91ff;--green:#60d6ab;--red:#ff929f;--yellow:#ffc977}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 80% -10%,#3a285d,transparent 35%),var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:3;background:#151629ed;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.top{max-width:1060px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px}.brand{font-weight:800;font-size:18px;cursor:pointer}.brand small{font-size:11px;color:var(--muted);display:block;font-weight:400}.shell{max-width:1060px;margin:auto;padding:22px 16px 55px}.hero{padding:19px 2px 9px}h1{font-size:clamp(23px,5vw,33px);margin:0 0 8px}h2{font-size:19px;margin:0 0 14px}h3{margin:0;font-size:16px}.sub,.muted{color:var(--muted)}.sub{line-height:1.7;margin:3px 0 16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:13px}.card{background:var(--surface);border:1px solid var(--line);padding:19px;border-radius:17px;margin-bottom:14px}.card.hover:hover{border-color:var(--accent)}button,.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:43px;padding:10px 15px;color:#181525;background:var(--accent);border:0;border-radius:11px;font-size:14px;font-weight:700;text-decoration:none}button:disabled{opacity:.4;cursor:not-allowed}button.secondary,.btn.secondary{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}button.danger{background:#693243;color:white}button.success{background:#17654f;color:white}.small{min-height:35px;padding:7px 11px;font-size:13px}.pill{font-size:12px;font-weight:750;border-radius:99px;padding:5px 10px;background:#333750;color:var(--muted)}.pill.ok{background:#1e493d;color:var(--green)}.pill.no{background:#61343f;color:var(--red)}.pill.wait{background:#514226;color:var(--yellow)}label{display:block;margin:13px 0 5px;font-size:14px;color:#d7dbed}input,textarea,select{width:100%;min-height:43px;border:1px solid #50536f;background:#15182a;color:var(--ink);padding:11px 13px;border-radius:10px;font-size:16px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:80px;resize:vertical}.help{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}.line{height:1px;background:var(--line);margin:16px 0}.stat{min-width:90px;flex:1;background:var(--surface2);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:25px}.stat small{color:var(--muted)}.list{display:flex;flex-direction:column;gap:9px}.entry{padding:13px;background:var(--surface2);border-radius:12px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.entry strong{word-break:break-all}.entry .actions{display:flex;gap:6px;flex-wrap:wrap}.empty{color:var(--muted);padding:23px;text-align:center;border:1px dashed var(--line);border-radius:12px}.hidden{display:none!important}.toast{position:fixed;z-index:20;bottom:23px;left:50%;transform:translateX(-50%);max-width:92%;padding:13px 18px;border-radius:12px;background:#ddd7ff;color:#211a36;box-shadow:0 8px 30px #0009;font-weight:650;text-align:center}.error{background:#6e3444;color:white}a{color:#cab9ff;word-break:break-all}code{color:#d2c7ff;overflow-wrap:anywhere}.w500{max-width:570px;margin:auto}.mt{margin-top:12px}.tiny{font-size:12px}.divider{margin:0 7px;color:var(--muted)}.loading{padding:65px 10px;text-align:center;color:var(--muted)}@media(max-width:530px){.shell{padding:17px 12px 60px}.card{padding:16px}.entry{align-items:flex-start}.entry .actions{width:100%}.entry .actions button{flex:1}.top{padding:11px 12px}.brand{font-size:15px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand" id="homeBtn">戰鬥陀螺 · 線上報名<small>獨立報名與審核平台</small></div><div class="row"><button id="adminBtn" class="secondary small">主辦登入</button><button id="logoutBtn" class="secondary small hidden">登出</button></div></div></header>
<main id="app" class="shell"><div class="loading">正在啟動平台…</div></main><div id="toast" class="toast hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
/* 第一次部署：將以下設定替換為你「獨立報名 Firebase 專案」的 Web App 設定。 */
const firebaseConfig = {
  apiKey: "AIzaSyDc0wD_Rfo4Ldf86stPbMHN9Q8Ng0PJsvo",
  authDomain: "ljtreg-39954.firebaseapp.com",
  databaseURL: "https://ljtreg-39954-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "ljtreg-39954",
  storageBucket: "ljtreg-39954.firebasestorage.app",
  messagingSenderId: "898101322849",
  appId: "1:898101322849:web:a0c568372940da7901f620",
  measurementId: "G-HYC9LPX8HJ"
};
const $=id=>document.getElementById(id), app=$('app'), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=(html)=>app.innerHTML=html;
function toast(message,error=false){const el=$('toast');el.textContent=message;el.className='toast'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3800)}
const statusLabel={pending:'待審核',approved:'審核通過',rejected:'未通過'};
const statusClass={pending:'wait',approved:'ok',rejected:'no'};
const pill=s=>`<span class="pill ${statusClass[s]||''}">${statusLabel[s]||'未知'}</span>`;
let db,auth,me=null,isAdmin=false,unsubscribe=[],routeKey='',currentEvent=null;
const cleanListeners=()=>{unsubscribe.forEach(f=>f());unsubscribe=[]};
const listen=(ref,cb)=>{ref.on('value',cb,e=>toast('讀取資料失敗：'+e.message,true));unsubscribe.push(()=>ref.off('value',cb))};
const page=(title,desc,html)=>show(`<section class="hero"><h1>${title}</h1><p class="sub">${desc}</p></section>${html}`);
const eventURL=id=>location.origin+location.pathname+'?event='+encodeURIComponent(id);
const ticketURL=(eid,ticket)=>eventURL(eid)+'&ticket='+encodeURIComponent(ticket);
function nav(params={}){const url=new URL(location.href);url.search='';Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));history.pushState(null,'',url);render()}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('已複製')}catch{prompt('請手動複製：',t)}}
function safeError(e){const s=String(e?.message||e||'操作失敗');toast(s,true)}
async function ensureAnon(){if(!auth.currentUser)await auth.signInAnonymously();return auth.currentUser}
function authButtons(){const adminUser=me&&!me.isAnonymous; $('adminBtn').classList.toggle('hidden',!!adminUser);$('logoutBtn').classList.toggle('hidden',!adminUser)}
function idGen(){const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
function fmt(t){return t?new Date(t).toLocaleString('zh-TW',{hour12:false}):'未設定'}
function eventCard(id,e,admin){return `<div class="card hover"><div class="row between"><h3>${escapeHTML(e.title)}</h3><span class="pill ${e.open?'ok':'no'}">${e.open?'報名開放':'暫停報名'}</span></div><p class="sub">${escapeHTML(e.description||'歡迎報名參加！')}</p><p class="tiny muted">截止：${e.deadline?fmt(e.deadline):'由主辦手動關閉'}</p><button data-open="${id}" class="${admin?'secondary':''}">${admin?'管理這場比賽':'前往報名'}</button></div>`}
function render(){cleanListeners();const q=new URLSearchParams(location.search),event=q.get('event'),ticket=q.get('ticket'),admin=q.has('admin');routeKey=location.search;
 if(!db){page('尚未設定 Firebase','請先編輯 index.html 的 firebaseConfig，再依安裝說明開啟 Firebase 服務。',`<div class="card">目前是功能預覽版；設定後才可以真正儲存與同步報名資料。</div>`);return}
 if(admin){if(!isAdmin){renderAdminLogin();return}const selected=q.get('manage');selected?renderManager(selected):renderAdminHome();return}
 if(event&&ticket){renderTicket(event,ticket);return}event?renderRegistration(event):renderPublicHome()}
function renderPublicHome(){page('找到想參加的比賽','選擇比賽，免登入即可提交報名資料。',`<div id="eventList" class="grid"><div class="loading">載入活動中…</div></div>`);listen(db.ref('events'),s=>{const events=s.val()||{};let arr=Object.entries(events).filter(([id,e])=>e.open&&(!e.deadline||e.deadline>Date.now()));$('eventList').innerHTML=arr.length?arr.sort((a,b)=>b[1].createdAt-a[1].createdAt).map(([id,e])=>eventCard(id,e,false)).join(''):'<div class="empty">目前沒有開放報名的比賽</div>'})}
function renderRegistration(eid){page('線上比賽報名','不需 Google 登入，提交後取得專屬審核結果查詢連結。',`<div id="registrationBody" class="w500"><div class="loading">載入比賽資訊…</div></div>`);
 listen(db.ref('events/'+eid),s=>{let e=s.val();currentEvent=e;const b=$('registrationBody');if(!b)return;if(!e){b.innerHTML='<div class="empty">此比賽不存在或已刪除</div>';return}const open=e.open&&(!e.deadline||e.deadline>Date.now()); if(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
 b.innerHTML=`<div class="card"><div class="row between"><h2>${escapeHTML(e.title)}</h2><span class="pill ${open?'ok':'no'}">${open?'報名中':'已截止'}</span></div><p class="sub">${escapeHTML(e.description||'歡迎參賽！')}</p>${e.deadline?`<p class="tiny muted">截止時間：${fmt(e.deadline)}</p>`:''}<div class="line"></div>${open?`<form id="entryForm"><label>手機後三碼 *</label><input id="phone3" inputmode="numeric" autocomplete="off" placeholder="例如：093" maxlength="3" pattern="[0-9]{3}" required><div class="help">請輸入完整三位數字，開頭的 0 也要保留。</div><label>LINE 名稱 *</label><input id="lineName" maxlength="40" placeholder="你的 LINE 顯示名稱" required><label class="mt"><input id="consent" type="checkbox" style="width:auto;min-height:0" required> 我同意主辦使用本次報名資料進行審核</label><p class="help">專屬查詢連結請妥善保存；任何取得連結的人都能看到審核結果。</p><button id="sendBtn" type="submit" style="width:100%;margin-top:13px">送出報名</button></form>`:'<div class="empty">目前不接受新報名</div>'}</div>`;
 const form=$('entryForm');if(form)form.onsubmit=async ev=>{ev.preventDefault();const phone=$('phone3').value.trim(),name=$('lineName').value.trim();if(!/^\d{3}$/.test(phone)||!name||name.length>40){toast('請確認手機後三碼與 LINE 名稱',true);return}const btn=$('sendBtn');btn.disabled=true;btn.textContent='送出中…';try{const user=await ensureAnon(),rid=idGen(),now=Date.now();const values={};values[`registrations/${eid}/${rid}`]={phone3:phone,lineName:name,status:'pending',submitterUid:user.uid,createdAt:now};values[`publicStatus/${eid}/${rid}`]={status:'pending',createdAt:now};await db.ref().update(values);nav({event:eid,ticket:rid})}catch(err){safeError(err);btn.disabled=false;btn.textContent='送出報名'}}
 })}
function renderTicket(eid,rid){page('報名審核結果','此連結可跨手機查看，建議收藏或分享給自己的 LINE。',`<div class="card w500" id="ticketBody"><div class="loading">正在查詢審核狀態…</div></div>`);listen(db.ref(`publicStatus/${eid}/${rid}`),s=>{const v=s.val(),b=$('ticketBody');if(!b)return;b.innerHTML=v?`<h2>目前狀態</h2><p style="font-size:22px">${pill(v.status)}</p><p class="sub">${v.status==='pending'?'主辦尚未完成審核，結果變更後會自動更新。':v.status==='approved'?'你的報名已審核通過。':'你的報名未通過審核；如有疑問請聯絡主辦。'}</p><button class="secondary" id="copyTicket">複製我的查詢連結</button><div class="help">此頁僅公開審核狀態，不公開手機後三碼或 LINE 名稱。</div>`:'<div class="empty">無法找到這筆報名。比賽或資料可能已被主辦刪除。</div>';if(v)$('copyTicket').onclick=()=>copy(ticketURL(eid,rid))})}
function renderAdminLogin(){page('主辦管理後台','主辦使用 Google 登入管理自己的報名活動。',`<div class="card w500"><h2>主辦登入</h2><p class="sub">選手不需要登入，此功能僅供有管理權限的主辦使用。</p><button id="loginGoogle">使用 Google 登入</button>${me&&!me.isAnonymous?'<p class="help">目前 Google 帳號未獲授權；請於 Firebase 的 admins 節點設定此帳號 UID。</p>':''}</div>`);$('loginGoogle').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());nav({admin:1})}catch(e){safeError(e)}}}
function renderAdminHome(){page('比賽管理','建立不同名稱的活動，獨立管理報名與審核。刪除活動將永久刪除該活動所有報名資料。',`<div class="row between" style="margin-bottom:15px"><button id="createBtn">＋ 建立新比賽</button></div><div id="myEvents" class="grid"><div class="loading">載入比賽中…</div></div>`);$('createBtn').onclick=showCreate;listen(db.ref('events'),s=>{const vals=s.val()||{},items=Object.entries(vals).sort((a,b)=>b[1].createdAt-a[1].createdAt);$('myEvents').innerHTML=items.length?items.map(([id,e])=>eventCard(id,e,true)).join(''):'<div class="empty">尚未建立活動，點選「建立新比賽」開始。</div>'})}
function showCreate(){cleanListeners();page('建立新比賽','比賽名稱與設定可日後修改，無需重新製作報名網站。',`<div class="card w500"><form id="createForm"><label>比賽名稱 *</label><input id="titleInput" maxlength="70" required placeholder="例如：金魚盃 2026"><label>活動說明（可留白）</label><textarea id="descriptionInput" maxlength="500" placeholder="日期、地點、注意事項…"></textarea><label>報名截止時間（可留白）</label><input id="deadlineInput" type="datetime-local"><p class="help">不設截止時間即可由主辦手動關閉報名。</p><div class="row mt"><button type="submit">建立並開放報名</button><button type="button" class="secondary" id="cancelBtn">取消</button></div></form></div>`);$('cancelBtn').onclick=()=>nav({admin:1});$('createForm').onsubmit=async ev=>{ev.preventDefault();const title=$('titleInput').value.trim(),desc=$('descriptionInput').value.trim(),d=$('deadlineInput').value; if(!title)return;try{const eid=idGen().slice(0,24);await db.ref('events/'+eid).set({title,description:desc,open:true,deadline:d?new Date(d).getTime():0,createdAt:Date.now(),updatedAt:Date.now()});nav({admin:1,manage:eid});toast('比賽已建立')}catch(e){safeError(e)}}}
let adminListCache={};
function renderManager(eid){page('報名審核管理',`<a href="?admin=1">← 返回全部比賽</a>`, `<div id="managerBody"><div class="loading">載入管理資料…</div></div>`);
 let e=null,registrations={};const draw=()=>{const b=$('managerBody');if(!b||!e)return;const rows=Object.entries(registrations).sort((a,b)=>b[1].createdAt-a[1].createdAt);const counts={pending:0,approved:0,rejected:0};rows.forEach(([,r])=>counts[r.status]=(counts[r.status]||0)+1);b.innerHTML=`<div class="card"><div class="row between"><h2>${escapeHTML(e.title)}</h2><span class="pill ${e.open?'ok':'no'}">${e.open?'開放中':'已關閉'}</span></div><p class="sub">${escapeHTML(e.description||'')}</p><div class="row"><button id="shareBtn" class="secondary small">複製報名網址</button><button id="toggleBtn" class="secondary small">${e.open?'關閉報名':'重新開放報名'}</button><button id="editBtn" class="secondary small">編輯活動</button><button id="deleteBtn" class="danger small">刪除整場比賽</button></div><p class="help">報名網址：<a target="_blank" rel="noopener" href="${eventURL(eid)}">${escapeHTML(eventURL(eid))}</a></p></div><div class="card"><div class="row"><div class="stat"><strong>${rows.length}</strong><small>全部報名</small></div><div class="stat"><strong>${counts.pending}</strong><small>待審核</small></div><div class="stat"><strong>${counts.approved}</strong><small>已通過</small></div><div class="stat"><strong>${counts.rejected}</strong><small>未通過</small></div></div><div class="row mt"><button class="success" id="copyList">複製合格名單</button><button class="secondary" id="csvBtn">下載合格 CSV</button></div><p class="help">複製名單只有 LINE 名稱，每位選手一行；CSV 包含比賽名稱、手機後三碼、LINE 名稱。</p></div><div class="card"><div class="row between"><h2>報名紀錄</h2><span class="muted tiny">即時更新</span></div><div class="row"><select id="filterSelect" style="max-width:170px"><option value="all">全部狀態</option><option value="pending">待審核</option><option value="approved">已通過</option><option value="rejected">未通過</option></select><input id="searchInput" placeholder="搜尋 LINE 名稱或後三碼" style="flex:1;min-width:180px"></div><div class="list mt" id="entryList"></div></div>`;
 $('shareBtn').onclick=()=>copy(eventURL(eid));$('toggleBtn').onclick=()=>db.ref('events/'+eid).update({open:!e.open,updatedAt:Date.now()}).catch(safeError);$('editBtn').onclick=()=>editEvent(eid,e);
 $('deleteBtn').onclick=async()=>{if(!confirm(`確定永久刪除「${e.title}」以及所有報名紀錄、公開查詢狀態？此操作無法復原。`))return;if(!confirm('再次確認：刪除後所有選手查詢連結都會失效。'))return;try{await db.ref().update({[`events/${eid}`]:null,[`registrations/${eid}`]:null,[`publicStatus/${eid}`]:null});toast('活動和所有報名資料已刪除');nav({admin:1})}catch(err){safeError(err)}};
 const approved=rows.filter(([,r])=>r.status==='approved');$('copyList').onclick=()=>approved.length?copy(approved.map(([,r])=>r.lineName).join('\n')):toast('目前沒有已通過的選手',true);
 $('csvBtn').onclick=()=>{const matrix=[['比賽名稱','手機後三碼','Line名稱'],...approved.map(([,r])=>[e.title,r.phone3,r.lineName])];const csv='\ufeff'+matrix.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download=(e.title.replace(/[\\/:*?"<>|]/g,'_')||'approved')+'_合格名單.csv';a.click();setTimeout(()=>URL.revokeObjectURL(href),500)};
 const drawEntries=()=>{let filter=$('filterSelect').value,search=$('searchInput').value.toLowerCase().trim();const filtered=rows.filter(([,r])=>(filter==='all'||r.status===filter)&&(!search||(r.phone3||'').includes(search)||(r.lineName||'').toLowerCase().includes(search)));$('entryList').innerHTML=filtered.length?filtered.map(([rid,r])=>`<div class="entry"><div><strong>${escapeHTML(r.lineName)}</strong> ${pill(r.status)}<div class="tiny muted">手機後三碼：${escapeHTML(r.phone3)}　·　${fmt(r.createdAt)}</div></div><div class="actions"><button class="success small" data-action="approved" data-id="${rid}">通過</button><button class="secondary small" data-action="pending" data-id="${rid}">待審核</button><button class="danger small" data-action="rejected" data-id="${rid}">不通過</button><button class="secondary small" data-action="edit" data-id="${rid}">編輯</button><button class="secondary small" data-action="delete" data-id="${rid}">刪除</button></div></div>`).join(''):'<div class="empty">沒有符合條件的報名者</div>'};$('filterSelect').onchange=drawEntries;$('searchInput').oninput=drawEntries;drawEntries();
 $('entryList').onclick=async ev=>{const btn=ev.target.closest('button[data-action]');if(!btn)return;const action=btn.dataset.action,rid=btn.dataset.id,r=registrations[rid];if(!r)return;try{if(['pending','approved','rejected'].includes(action)){const changes={};changes[`registrations/${eid}/${rid}/status`]=action;changes[`publicStatus/${eid}/${rid}/status`]=action;await db.ref().update(changes)}else if(action==='edit'){const name=prompt('LINE 名稱',r.lineName);if(name===null)return;const phone=prompt('手機後三碼',r.phone3);if(phone===null)return;if(!name.trim()||name.trim().length>40||!/^\d{3}$/.test(phone)){toast('請輸入有效的 LINE 名稱與三位數字',true);return}await db.ref(`registrations/${eid}/${rid}`).update({lineName:name.trim(),phone3:phone})}else if(action==='delete'){if(!confirm('永久刪除這筆報名？查詢連結將失效。'))return;await db.ref().update({[`registrations/${eid}/${rid}`]:null,[`publicStatus/${eid}/${rid}`]:null})}}catch(err){safeError(err)}};
 };
 listen(db.ref('events/'+eid),s=>{e=s.val();if(!e){nav({admin:1});return}draw()});listen(db.ref('registrations/'+eid),s=>{registrations=s.val()||{};draw()})}
function editEvent(id,e){cleanListeners();page('編輯比賽','更新後會即時同步至報名頁。',`<div class="card w500"><form id="editForm"><label>比賽名稱</label><input id="t" required maxlength="70" value="${escapeHTML(e.title)}"><label>說明</label><textarea id="d" maxlength="500">${escapeHTML(e.description||'')}</textarea><label>截止時間</label><input id="when" type="datetime-local"><div class="row mt"><button type="submit">儲存修改</button><button class="secondary" type="button" id="backBtn">取消</button></div></form></div>`);if(e.deadline){const dt=new Date(e.deadline),local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);$('when').value=local}$('backBtn').onclick=()=>nav({admin:1,manage:id});$('editForm').onsubmit=async ev=>{ev.preventDefault();const v=$('t').value.trim(),desc=$('d').value.trim(),when=$('when').value;if(!v)return;try{await db.ref('events/'+id).update({title:v,description:desc,deadline:when?new Date(when).getTime():0,updatedAt:Date.now()});nav({admin:1,manage:id})}catch(err){safeError(err)}}}
$('homeBtn').onclick=()=>nav();$('adminBtn').onclick=()=>nav({admin:1});$('logoutBtn').onclick=async()=>{try{await auth.signOut();isAdmin=false;nav()}catch(e){safeError(e)}};
app.onclick=ev=>{const b=ev.target.closest('[data-open]');if(b)nav(isAdmin&&new URLSearchParams(location.search).has('admin')?{admin:1,manage:b.dataset.open}:{event:b.dataset.open})};

(async()=>{if(firebaseConfig.apiKey.includes('PASTE_')){render();return}try{firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth();auth.onAuthStateChanged(async u=>{me=u;authButtons();if(u&&!u.isAnonymous){try{const snap=await db.ref('admins/'+u.uid).get();isAdmin=snap.val()===true}catch{isAdmin=false}}else isAdmin=false;render()})}catch(e){page('Firebase 啟動失敗',escapeHTML(e.message),'<div class="card">請檢查 firebaseConfig 與 Firebase 專案設定。</div>')}})();
