async function get(path,privateRead=false,query=null){
 if(!managerVisible())throw new DOMException('頁面已休眠','AbortError');
 const url=new URL(DB+'/'+path+'.json');if(query)for(const [k,v] of Object.entries(query))url.searchParams.set(k,v);

 if(!managerVisible())throw new DOMException('頁面已休眠','AbortError');
 const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),12000);managerReads.add(ctl);
 try{const res=await fetch(url.toString(),{cache:'no-store',signal:ctl.signal});if(!res.ok)throw Error('雲端讀取失敗（HTTP '+res.status+'）');return await res.json()}
 finally{clearTimeout(timeout);managerReads.delete(ctl)}
}
async function call(name,data){if(!user)throw Error('尚未登入主辦帳號');const token=await user.getIdToken(),ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),20000);try{const r=await fetch(FN+name,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({data}),signal:ctl.signal});const p=await r.json();if(p.error||!r.ok)throw Error(p.error?.message||'雲端操作失敗');return p.result}finally{clearTimeout(tm)}}
function statRank(items,capacity){const ordered=Object.values(items||{}).filter(v=>v&&v.status!=='deleted').sort((a,b)=>a.signupNo-b.signupNo);const map=new Map();let i=0;for(const r of ordered)if(r.status!=='rejected'){i++;map.set(r.signupNo,i<=capacity?'正選#'+i:'備選#'+(i-capacity))}return {ordered:ordered.sort((a,b)=>(a.status==='rejected')-(b.status==='rejected')||a.signupNo-b.signupNo),map,active:i}}

function collect(f){const d=Object.fromEntries(new FormData(f));d.fee=Number(d.fee);d.capacity=Number(d.capacity);return d}
function createRequestId(m){
 const content=JSON.stringify(m),storageKey='reg-v02-create-request';
 try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(saved?.content===content&&/^[0-9a-f]{48}$/.test(saved.createId))return saved.createId}catch{}
 const createId=Array.from(crypto.getRandomValues(new Uint8Array(24)),v=>v.toString(16).padStart(2,'0')).join('');
 try{sessionStorage.setItem(storageKey,JSON.stringify({content,createId}))}catch{}

}
async function submitCreate(e){e.preventDefault();if(loading)return;loading=true;try{

function render(){if(!user){$('app').innerHTML='<section class="card"><h1>主辦管理後台</h1><p class="muted">請使用 Google 帳號登入；選手不必登入。</p><button id="startLogin">使用 Google 登入</button></section>';$('startLogin').onclick=()=>$('authBtn').click();return}if(mode==='create'){let draft={};try{draft=JSON.parse(sessionStorage.getItem('reg-v02-event-draft')||'{}')}catch{}$('app').innerHTML='<h1>建立新比賽</h1><section class="card" style="max-width:800px"><form id="createForm">'+formFields(draft)+'<div class="formBtns"><button type="submit">建立並開放報名</button><button type="button" class="alt" id="cancel">取消</button></div></form></section>';$('createForm').onsubmit=submitCreate;$('createForm').oninput=e=>{try{sessionStorage.setItem('reg-v02-event-draft',JSON.stringify(Object.fromEntries(new FormData(e.currentTarget))))}catch{}};$('cancel').onclick=()=>go('home');return}if(mode==='home'){renderHome();return}renderManage()}

 if(homeLoading){homeRefreshPending=true;return}
 homeLoading=true;homeRefreshPending=false;const view=mode;$('app').innerHTML='<h1>我的比賽</h1><section class="card"><button id="newEvent">＋ 建立新比賽</button></section><div id="events">正在讀取雲端活動索引…</div>';$('newEvent').onclick=()=>go('create');
 try{const ownerUid=user.uid,newIndex=await get('ownerEventsV02/'+ownerUid,true);if(mode!=='home'||view!==mode||user?.uid!==ownerUid)return;
  const cards=Object.entries(newIndex||{}).map(([id,m])=>`<article class="card"><span class="badge">精簡節點活動</span><h2>${safe(m.title)}</h2><p class="dim">📅 ${safe(m.eventDate)} · 正選 ${m.capacity} 人</p><button class="alt" data-manage="${id}">進入報名管理 →</button></article>`);
  $('events').innerHTML=cards.length?'<div class="grid">'+cards.join('')+'</div>':'<div class="msg">尚無活動。</div>';

 finally{homeLoading=false;if(homeRefreshPending&&managerVisible()&&mode==='home'){homeRefreshPending=false;setTimeout(renderHome,0)}}}
// Organizer listens to the same tiny public sync marker; private records are still fetched via authenticated HTTPS.
let managerStream=null,managerOnline=false,managerRetry=null,managerDebounce=null,managerHint=null,managerDenied=false,managerRetryAttempt=0;
// V0.2 organizer lifecycle: no live connection or scheduled GET while backgrounded.
let managerSleeping=document.visibilityState!=='visible',managerWatch=null,managerStable=null;
let managerFallbackAfter=0,managerFallbackFailures=0;const managerReads=new Set();
let managerLoading=false,managerResumePending=false,homeLoading=false,homeRefreshPending=false,managerForcedCatchup=false;
function managerVisible(){return !managerSleeping&&document.visibilityState==='visible'}
function managerWatchStop(){clearTimeout(managerWatch);managerWatch=null}
function managerWatchStart(){
 managerWatchStop();if(!managerVisible()||!user||mode!=='manage')return;
 managerWatch=setTimeout(()=>{
  if(!managerVisible()||!user||mode!=='manage')return;
  if($('modal').classList.contains('hide')&&!syncBusy&&eventMeta){
   const now=Date.now();
   if(managerOnline){if(now-lastFetch>=120000)pollChanges()}
   else if(now>=managerFallbackAfter){
    managerFallbackAfter=now+Math.min(120000,30000*2**Math.min(managerFallbackFailures,2))+Math.floor(Math.random()*2500);
    pollChanges();
   }
  }
  managerWatchStart();
 },20000)
}
function managerSleep(){
 managerSleeping=true;managerWatchStop();stopManagerLive();
 for(const ctl of managerReads)ctl.abort();
}
function managerWake(){
 if(document.visibilityState!=='visible')return;

 if(!user)return;

  if(!eventMeta){renderManage();return}
  startManagerLive();scheduleManagerCheck();managerWatchStart();
 }else if(mode==='home'&&(homeRefreshPending||Date.now()-lastFetch>20000))renderHome();
}
function stopManagerLive(){clearTimeout(managerRetry);clearTimeout(managerDebounce);clearTimeout(managerStable);managerRetry=managerDebounce=managerStable=null;managerHint=null;if(managerStream){managerStream.close();managerStream=null}managerOnline=false}

function startManagerLive(){
 if(managerStream||managerDenied||!user||mode!=='manage'||!eid||!managerVisible()||typeof EventSource==='undefined')return;
 const id=eid,s=new EventSource(DB+'/syncV02/'+id+'.json');managerStream=s;
 s.onopen=()=>{if(s!==managerStream||!managerVisible())return;managerOnline=true;managerFallbackFailures=0;clearTimeout(managerStable);managerStable=setTimeout(()=>{if(s===managerStream&&managerOnline)managerRetryAttempt=0},30000)};
 const onChange=ev=>{if(eid!==id||s!==managerStream||!managerVisible())return;try{const v=JSON.parse(ev.data);if(v.path==='/'){if(v.data?.token===syncToken)return;scheduleManagerCheck(v.data)}else if(v.path==='/token')scheduleManagerCheck({token:v.data});else if(v.path==='/lastChange')scheduleManagerCheck()}catch{scheduleManagerCheck()}};
 s.addEventListener('put',onChange);s.addEventListener('patch',onChange);
 const denied=()=>{stopManagerLive();managerDenied=true;msg('即時通知暫不可用，已切換低頻檢查','warn')};

  managerRetry=setTimeout(()=>{managerRetry=null;startManagerLive()},delay);

async function fetchManager(){const id=eid;const started=await get('syncV02/'+id);const [m,ro,pr]=await Promise.all([get('eventsV02/'+id+'/meta'),get('publicRowsV02/'+id),get('privateRowsV02/'+id,true)]);if(mode!=='manage'||eid!==id||!managerVisible())return false;if(!m||m.deleted)throw Error('找不到活動');eventMeta=m;rows=ro||{};extras=pr||{};syncToken=started?.token||null;lastChangeCursor=started?.lastChange||'';lastFetch=Date.now();return true}

async function refresh(){if(mode!=='manage')return;try{if(await fetchManager())drawManager()}catch(e){msg('重新讀取失敗，保留畫面資料：'+e.message,'err')}}
// Check one tiny sync node first; when unchanged, NO roster GET takes place.
// After a change only retrieve the affected row(s). Large change bursts fall back to one snapshot.
async function pollChanges(){
 if(mode!=='manage'||!eid||!user||!managerVisible())return;
 if(syncBusy){managerForcedCatchup=true;return}
 syncBusy=true;const id=eid,uid=user.uid;
 try{
  const hinted=managerHint;managerHint=null;
  const stamp=hinted?.token&&typeof hinted.lastChange==='string'?hinted:await get('syncV02/'+id);
  if(!stamp)return;
  if(!managerVisible())return;
  if(stamp.token===syncToken){lastFetch=Date.now();managerFallbackFailures=0;return}
  // A concurrent writer can commit an older push key AFTER our current cursor.
  // Correctness wins: on non-forward progress, re-fetch one event snapshot.
  if(lastChangeCursor&&stamp.lastChange&&stamp.lastChange<=lastChangeCursor){await refresh();return}
  const query=lastChangeCursor?{'orderBy':'"$key"','startAt':JSON.stringify(lastChangeCursor),'limitToFirst':'101'}:{'orderBy':'"$key"','limitToFirst':'101'};
  const history=await get('changesV02/'+id,false,query);
  if(mode!=='manage'||eid!==id||user?.uid!==uid)return;
  const entries=Object.entries(history||{}).sort((a,b)=>a[0].localeCompare(b[0]));
  const continuous=lastChangeCursor?entries[0]?.[0]===lastChangeCursor:true;
  if(!continuous||entries.length>=101){await refresh();return}
  const unseen=entries.filter(([key])=>key!==lastChangeCursor);
  const affected=new Map();let metaChanged=false;
  for(const [key,c] of unseen){if(c.type==='meta')metaChanged=true;
   else if(/^p\d{8}$/.test(c.key||''))affected.set(c.key,c.type)}
  if(metaChanged){const m=await get('eventsV02/'+id+'/meta');if(m)eventMeta=m}
  // Fetch the final state of each affected row once, not once per journal entry.
  const targets=[...affected.entries()];for(let i=0;i<targets.length;i+=6){
   await Promise.all(targets.slice(i,i+6).map(async ([key,type])=>{
    const publicRow=await get('publicRowsV02/'+id+'/'+key);if(publicRow)rows[key]=publicRow;else delete rows[key];
    if(type!=='review'){const priv=await get('privateRowsV02/'+id+'/'+key,true);if(priv)extras[key]=priv;else delete extras[key]}
   }))
  }
  if(mode!=='manage'||eid!==id||user?.uid!==uid)return;
  
  if(!managerVisible())return;lastChangeCursor=entries.at(-1)?.[0]||lastChangeCursor;syncToken=stamp.token;lastFetch=Date.now();managerFallbackFailures=0;drawManager();
 }catch(e){if(mode==='manage'&&managerVisible()){managerFallbackFailures=Math.min(managerFallbackFailures+1,2);msg('增量更新暫時失敗，可按「手動重新同步」：'+e.message,'warn')}}
 finally{syncBusy=false;if(managerVisible()&&(managerForcedCatchup||(managerHint&&managerHint.token!==syncToken))){managerForcedCatchup=false;scheduleManagerCheck()}}
}

function copy(t){navigator.clipboard?.writeText(t).then(()=>msg('已複製')).catch(()=>window.prompt('請長按複製',t))}
async function reloadAffected(data,name){if(name==='regV02Review'||name==='regV02EditEntry'||name==='regV02DeleteEntry'){
  const key=data.key,rr=await get('publicRowsV02/'+eid+'/'+key);if(rr)rows[key]=rr;else delete rows[key];
  if(name!=='regV02Review'){const priv=await get('privateRowsV02/'+eid+'/'+key,true);if(priv)extras[key]=priv;else delete extras[key]}
 }else if(name==='regV02UpdateEvent'||name==='regV02SetOpen'){eventMeta=await get('eventsV02/'+eid+'/meta')}
}
async function attempt(name,data){if(loading)return null;loading=true;
 try{msg('等待伺服器確認…','warn');const out=await call(name,data);
  if(name==='regV02Review'||name==='regV02EditEntry'){rows[data.key]=out.row;if(out.private)extras[data.key]=out.private}
  else if(name==='regV02DeleteEntry'){delete rows[data.key];delete extras[data.key]}
  else if(name==='regV02UpdateEvent'||name==='regV02SetOpen'){eventMeta=out.meta}
  closeModal();if(mode==='manage')drawManager();msg('雲端確認操作成功');return out;
 }catch(e){msg('當次操作未完成：'+e.message+'；正在確認相關節點。未自動重送','err');try{await reloadAffected(data,name);if(mode==='manage')drawRoster()}catch{}
  if(!$('modal').classList.contains('hide')){const b=document.createElement('div');b.className='status err';b.textContent='伺服器拒絕這次修改，已嘗試更新相關紀錄。未送出的表單仍保留；請關閉視窗後重新開啟，再確認最新資料。';$('modalContent').prepend(b)}
  if(mode==='manage')drawManager();return null
 }finally{loading=false}}

function editEntry(key){const r=rows[key],p=extras[key];if(!r)return;openModal(`<h2>編輯選手資料</h2><form id="entryForm"><label>比賽名稱</label><input name="playerName" required maxlength="50" value="${safe(r.playerName)}"><label>手機後三碼</label><input name="phone3" inputmode="numeric" pattern="[0-9]{3}" required value="${safe(r.phone3)}"><label>LINE 名稱</label><input name="lineName" maxlength="40" required value="${safe(p?.lineName||'')}"><div class="formBtns"><button type="submit">儲存</button><button type="button" class="alt" id="cancel">取消</button></div></form><button type="button" class="bad close" id="deleteRow">刪除選手</button>`);$('cancel').onclick=closeModal;$('entryForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.playerName.trim()===r.playerName&&data.phone3.trim()===r.phone3&&data.lineName.trim()===(p?.lineName||'')){closeModal();msg('選手資料未變更，不需要發送雲端請求');return}attempt('regV02EditEntry',{eid,key,expectedVersion:r.recordVersion,...data})};$('deleteRow').onclick=()=>{if(confirm('確定刪除這筆報名？'))attempt('regV02DeleteEntry',{eid,key,expectedVersion:r.recordVersion})};}
function editEvent(){openModal(`<h2>編輯比賽</h2><form id="editForm">${formFields(eventMeta)}<div class="formBtns"><button type="submit">儲存</button><button class="alt" type="button" id="cancel">取消</button></div></form>`);$('cancel').onclick=closeModal;$('editForm').onsubmit=e=>{e.preventDefault();const data=collect(e.target);if(Object.entries(data).every(([k,v])=>v===eventMeta[k])){closeModal();msg('活動設定未變更，不需要發送雲端請求');return}attempt('regV02UpdateEvent',{eid,expectedVersion:eventMeta.version,...data})}}
