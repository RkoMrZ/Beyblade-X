 const label=rankText(ticket.signupNo,ledger,event.capacity,ticket.status);box.innerHTML=`<div class="tiny muted">原始報名順序：第 ${ticket.signupNo} 位</div><h2 style="font-size:clamp(25px,6vw,35px);margin:12px 0">${E(label)}</h2>${statusPill(ticket.status)}<p class="sub mt">報名時間：${E(date(ticket.createdAt))}</p><p class="help">原始順位保持不變；審核不通過會暫時移出，恢復時依原報名順序重新計算。顯示的正備選編號可能即時變動。</p><button class="secondary" id="copyLink">複製我的查詢連結</button>`;$('copyLink').onclick=()=>copy(ticketURL(eid,rid))};
 stream('eventStates/'+eid+'/public',v=>{event=v;got.event=true;draw()});stream('eventStates/'+eid+'/rankLedger',v=>{ledger=v||{};got.ledger=true;draw()});stream('eventStates/'+eid+'/tickets/'+rid,v=>{ticket=v;got.ticket=true;draw()});
}
async function copy(str){if(!str){showToast('目前沒有符合條件的正選',true);return}try{await navigator.clipboard.writeText(str);showToast('已複製')}catch{prompt('請手動複製：',str)}}

// ===== 介面測試專用模型 =====
// 唯一目的：檢查手機排版及操作流程。測試狀態只放在 sessionStorage，永遠不呼叫 Firebase。
const PREVIEW_STORE='reg_ui_demo_20261014',previewSubscriptions=new Set();
function previewSeed(){
 const eid='e'.repeat(24),now=Date.now(),publicInfo={title:'示範測試盃（可測試遞補）',eventDate:'2026-11-01',checkinTime:'09:00',startTime:'10:00',venue:'示範體育館',fee:0,capacity:32,open:true,createdAt:now,updatedAt:now,metaVersion:1};
 const e={ownerUid:'preview-owner',public:publicInfo,nextNo:35,revision:1,registrations:{},tickets:{},rankLedger:{},byUser:{}};
 for(let i=1;i<=35;i++){const rid=i.toString(16).padStart(48,'0'),r={rid,phone3:String(100+i),lineName:'示範選手 '+String(i).padStart(2,'0'),submitterUid:'preview-user-'+i,status:'pending',signupNo:i,createdAt:now+i*1000,recordVersion:1};e.registrations[rid]=r;e.tickets[rid]={status:r.status,signupNo:i,createdAt:r.createdAt,recordVersion:1};e.rankLedger[String(i)]=1;e.byUser[r.submitterUid]=rid}
 return {ownerEvents:{'preview-owner':{[eid]:now}},eventStates:{[eid]:e}};
}
let previewDB;
try{previewDB=JSON.parse(sessionStorage.getItem(PREVIEW_STORE)||'null')}catch{}
if(!previewDB?.ownerEvents||!previewDB?.eventStates)previewDB=previewSeed();
function previewSave(){try{sessionStorage.setItem(PREVIEW_STORE,JSON.stringify(previewDB))}catch{}}
previewSave();
function previewValue(path){return path.split('/').filter(Boolean).reduce((x,k)=>x?.[k],previewDB)??null}
function previewNotify(){previewSave();for(const {path,renderCallback} of [...previewSubscriptions]){try{renderCallback(structuredClone(previewValue(path)))}catch(err){console.error(err)}}}
function previewBad(msg){throw Error(msg)}
async function previewCall(name,d={}){
 const eid=d.eid,e=previewDB.eventStates[eid],now=Date.now();let result;
 if(name==='regCreateEvent'){
  const val={title:d.title,eventDate:d.eventDate,checkinTime:d.checkinTime,startTime:d.startTime,venue:d.venue,fee:d.fee,capacity:d.capacity};
  const id=Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('');
  previewDB.eventStates[id]={ownerUid:'preview-owner',public:{...val,open:true,createdAt:now,updatedAt:now,metaVersion:1},nextNo:0,revision:0,registrations:{},tickets:{},rankLedger:{},byUser:{}};
  previewDB.ownerEvents['preview-owner'][id]=now;result={eid:id};
 }else if(!e){previewBad('模擬比賽不存在。重新整理示範資料再試。')}
 else if(name==='regUpdateEvent'){
  if(d.expectedVersion!==e.public.metaVersion)previewBad('比賽設定已被其他操作更新，請重新載入');
  if(e.nextNo>0&&d.capacity!==e.public.capacity)previewBad('有報名資料後不能更改正選人數');
  Object.assign(e.public,{title:d.title,eventDate:d.eventDate,checkinTime:d.checkinTime,startTime:d.startTime,venue:d.venue,fee:d.fee,capacity:d.capacity,updatedAt:now,metaVersion:e.public.metaVersion+1});e.revision++;result={ok:true};
 }else if(name==='regSetOpen'){
  if(d.expectedVersion!==e.public.metaVersion)previewBad('報名開關已更新，請重新整理');
  e.public.open=!!d.open;e.public.metaVersion++;e.public.updatedAt=now;e.revision++;result={ok:true};
 }else if(name==='regSubmit'){
  if(!e.public.open)previewBad('報名已關閉');
  if(e.registrations[d.rid]){result={rid:d.rid,signupNo:e.registrations[d.rid].signupNo}}
  else{
   if(e.byUser['preview-visitor'])previewBad('此示範瀏覽器已報名過同一場，請使用既有連結');
   const n=++e.nextNo,r={rid:d.rid,phone3:d.phone3,lineName:d.lineName,submitterUid:'preview-visitor',status:'pending',signupNo:n,createdAt:now,recordVersion:1};
   e.registrations[d.rid]=r;e.tickets[d.rid]={status:r.status,signupNo:n,createdAt:now,recordVersion:1};e.rankLedger[String(n)]=1;e.byUser['preview-visitor']=d.rid;e.revision++;result={rid:d.rid,signupNo:n};
  }
 }else if(name==='regRecover'){
  const rid=e.byUser['preview-visitor'];result={rid:rid||null};
 }else if(['regReview','regEditEntry','regDeleteEntry'].includes(name)){
  const r=e.registrations[d.rid];if(!r)previewBad('選手不存在');
  if(d.expectedVersion!==r.recordVersion)previewBad('這筆報名已變更，請重新取得資料');
  if(name==='regReview'){r.status=d.status;r.recordVersion++;e.tickets[d.rid].status=d.status;e.tickets[d.rid].recordVersion++;e.rankLedger[String(r.signupNo)]=d.status==='rejected'?0:1;}
  if(name==='regEditEntry'){r.lineName=d.lineName;r.phone3=d.phone3;r.recordVersion++}
  if(name==='regDeleteEntry'){delete e.registrations[d.rid];delete e.tickets[d.rid];e.rankLedger[String(r.signupNo)]=0;delete e.byUser[r.submitterUid];}
  e.revision++;result={ok:true};
 }else if(name==='regDeleteEvent'){
  delete previewDB.eventStates[eid];delete previewDB.ownerEvents['preview-owner'][eid];result={ok:true};
 }else previewBad('預覽模式未支援的模擬操作：'+name);
 // 延遲通知，避免重繪時移除尚未完成的按鈕事件。
 queueMicrotask(previewNotify);
 return result;
}
