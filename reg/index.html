async function get(path,privateRead=false,query=null){const url=new URL(DB+'/'+path+'.json');if(query)for(const [k,v] of Object.entries(query))url.searchParams.set(k,v);if(privateRead){if(!user)throw Error('尚未登入');url.searchParams.set('auth',await user.getIdToken())}const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),12000);try{const res=await fetch(url.toString(),{cache:'no-store',signal:ctl.signal});if(!res.ok)throw Error('雲端讀取失敗（HTTP '+res.status+'）');return await res.json()}finally{clearTimeout(timeout)}}

function createRequestId(m){

$('refresh').onclick=refresh;$('search').value=preservedQuery;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===tab)));drawRoster()});$('search').oninput=drawRoster;drawRoster();msg('已取得最新雲端資料');}
function drawRoster(){if(mode!=='manage'||!$('roster'))return;const s=statRank(rows,eventMeta.capacity),q=$('search').value.trim().toLowerCase();const items=s.ordered.filter(r=>(tab==='all'||r.status===tab)&&(r.playerName.toLowerCase().includes(q)||r.phone3.includes(q)||(extras['p'+String(r.signupNo).padStart(8,'0')]?.lineName||'').toLowerCase().includes(q)));
$('roster').innerHTML='<div class="tableWrap"><table><thead><tr><th>比賽名稱</th><th>LINE／手機後三碼</th><th>審核狀態</th><th>正備選編號</th><th>編輯</th></tr></thead><tbody>'+ (items.length?items.map(r=>{const key='p'+String(r.signupNo).padStart(8,'0');return `<tr><td><strong>${safe(r.playerName)}</strong></td><td class="contact">${safe(extras[key]?.lineName||'—')}<small>${safe(r.phone3)}</small></td><td><button class="alt sm reviewbtn ${safe(r.status)}" data-review="${key}">${safe(statusName[r.status])}⌄</button></td><td><span class="rank">${safe(s.map.get(r.signupNo)||'—')}</span></td><td><button class="alt sm" data-edit="${key}">編輯</button></td></tr>`}).join(''):'<tr><td colspan="5" class="muted" style="text-align:center">沒有符合條件的選手</td></tr>')+'</tbody></table></div>';
$('roster').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review));$('roster').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEntry(b.dataset.edit));}
async function refresh(){if(mode!=='manage')return;try{if(await fetchManager())drawManager()}catch(e){msg('重新讀取失敗，保留畫面資料：'+e.message,'err')}}
// Check one tiny sync node first; when unchanged, NO roster GET takes place.
// After a change only retrieve the affected row(s). Large change bursts fall back to one snapshot.
async function pollChanges(){if(mode!=='manage'||!eid||syncBusy||!user)return;syncBusy=true;try{
 const stamp=await get('syncV8/'+eid);if(!stamp||stamp.token===syncToken)return;
 const history=await get('changesV8/'+eid,false,{'orderBy':'"$key"','limitToLast':'100'});const entries=Object.entries(history||{}).sort((a,b)=>a[0].localeCompare(b[0])),unseen=entries.filter(([id])=>!seenChanges.has(id));
 if(entries.length>=100&&!entries.some(([id])=>seenChanges.has(id))){await refresh();return}
 for(const [id,c] of unseen){seenChanges.add(id);if(c.type==='meta'){const m=await get('eventsV8/'+eid+'/meta');if(m)eventMeta=m;continue}
  if(!/^p\d{8}$/.test(c.key||''))continue;const row=await get('publicRowsV8/'+eid+'/'+c.key);if(row)rows[c.key]=row;else delete rows[c.key];
  if(c.type!=='review'){const priv=await get('privateRowsV8/'+eid+'/'+c.key,true);if(priv)extras[c.key]=priv;else delete extras[c.key]}
 }
 if(seenChanges.size>250)seenChanges=new Set([...seenChanges].slice(-150));syncToken=stamp.token;drawManager();
 }catch(e){msg('增量更新暫時失敗；可按「重整雲端資料」：'+e.message,'warn')}finally{syncBusy=false}}

function copy(t){navigator.clipboard?.writeText(t).then(()=>msg('已複製')).catch(()=>window.prompt('請長按複製',t))}
async function reloadAffected(data,name){if(name==='reg8Review'||name==='reg8EditEntry'||name==='reg8DeleteEntry'){
  const key=data.key,rr=await get('publicRowsV8/'+eid+'/'+key);if(rr)rows[key]=rr;else delete rows[key];
  if(name!=='reg8Review'){const priv=await get('privateRowsV8/'+eid+'/'+key,true);if(priv)extras[key]=priv;else delete extras[key]}
 }else if(name==='reg8UpdateEvent'||name==='reg8SetOpen'){eventMeta=await get('eventsV8/'+eid+'/meta')}
}
async function attempt(name,data){if(loading)return null;loading=true;
 try{msg('等待伺服器確認…','warn');const out=await call(name,data);
  if(name==='reg8Review'||name==='reg8EditEntry'){rows[data.key]=out.row;if(out.private)extras[data.key]=out.private}
  else if(name==='reg8DeleteEntry'){delete rows[data.key];delete extras[data.key]}
  else if(name==='reg8UpdateEvent'||name==='reg8SetOpen'){eventMeta=out.meta}
  closeModal();if(mode==='manage')drawManager();msg('雲端確認操作成功');return out;
 }catch(e){msg('當次操作未完成：'+e.message+'；正在確認相關節點。未自動重送','err');try{await reloadAffected(data,name);if(mode==='manage')drawRoster()}catch{}
  if(!$('modal').classList.contains('hide')){const b=document.createElement('div');b.className='status err';b.textContent='伺服器拒絕這次修改，已嘗試更新相關紀錄。未送出的表單仍保留；請關閉視窗後重新開啟，再確認最新資料。';$('modalContent').prepend(b)}
  if(mode==='manage')drawManager();return null
 }finally{loading=false}}
function review(key){const r=rows[key];if(!r)return;openModal(`<h2>${safe(r.playerName)}</h2><p class="muted">目前：${safe(statusName[r.status])} · 原始順位 #${r.signupNo}</p><div class="stack">${[['pending','待審核'],['approved','通過'],['rejected','不通過']].map(([s,n])=>`<button data-to="${s}" class="${s==='approved'?'good':s==='rejected'?'bad':'alt'}">${n}</button>`).join('')}</div><button class="alt close" id="close">取消</button>`);$('close').onclick=closeModal;$('modalContent').querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>attempt('reg8Review',{eid,key,status:b.dataset.to,expectedVersion:r.recordVersion}));}
function editEntry(key){const r=rows[key],p=extras[key];if(!r)return;openModal(`<h2>編輯選手資料</h2><form id="entryForm"><label>比賽名稱</label><input name="playerName" required maxlength="50" value="${safe(r.playerName)}"><label>手機後三碼</label><input name="phone3" inputmode="numeric" pattern="[0-9]{3}" required value="${safe(r.phone3)}"><label>LINE 名稱</label><input name="lineName" maxlength="40" required value="${safe(p?.lineName||'')}"><div class="formBtns"><button type="submit">儲存</button><button type="button" class="alt" id="cancel">取消</button></div></form><button type="button" class="bad close" id="deleteRow">刪除選手</button>`);$('cancel').onclick=closeModal;$('entryForm').onsubmit=e=>{e.preventDefault();attempt('reg8EditEntry',{eid,key,expectedVersion:r.recordVersion,...Object.fromEntries(new FormData(e.target))})};$('deleteRow').onclick=()=>{if(confirm('確定刪除這筆報名？'))attempt('reg8DeleteEntry',{eid,key,expectedVersion:r.recordVersion})};}
function editEvent(){openModal(`<h2>編輯比賽</h2><form id="editForm">${formFields(eventMeta)}<div class="formBtns"><button type="submit">儲存</button><button class="alt" type="button" id="cancel">取消</button></div></form>`);$('cancel').onclick=closeModal;$('editForm').onsubmit=e=>{e.preventDefault();attempt('reg8UpdateEvent',{eid,expectedVersion:eventMeta.version,...collect(e.target)})}}
function toggleOpen(){attempt('reg8SetOpen',{eid,open:!eventMeta.open,expectedVersion:eventMeta.version})}
function deleteEvent(){if(!confirm('確定刪除此比賽及全部報名紀錄？無法復原！'))return;attempt('reg8DeleteEvent',{eid}).then(v=>{if(v)go('home')})}
window.addEventListener('hashchange',fromHash);window.addEventListener('pageshow',e=>{if(e.persisted&&user)mode==='manage'?pollChanges():renderHome()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user&&Date.now()-lastFetch>20000){if(mode==='manage'&&!$('modal').classList.contains('hide'))return;if(mode==='manage')pollChanges();else if(mode==='home')renderHome()}});
setInterval(()=>{if(document.visibilityState!=='visible'||!user||!$('modal').classList.contains('hide'))return;if(mode==='manage')pollChanges()},45000);
onAuthStateChanged(auth,u=>{user=u;$('authBtn').textContent=u?'登出':'主辦登入';msg(u?'已登入｜HTTPS 雲端資料模式':'登入後可建立和審核比賽');fromHash()});
</script></body></html>
