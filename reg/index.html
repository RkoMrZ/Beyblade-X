/* iOS Safari: 原生 date/time 輸入的 intrinsic width 不得撐破欄位 */

/* =============================================================

   ============================================================= */

/* 2026-10-14 試算表審核名單、狀態分頁、選手報名確認 */
.rosterHeading{margin-bottom:15px}
.filtersBar{display:flex;flex-direction:column;gap:11px}

.reviewTab{background:var(--surface2);color:var(--label);border:1px solid var(--line);border-radius:9px;min-width:0;min-height:42px;padding:8px 6px;font-size:13px;white-space:nowrap;gap:5px}

.reviewTab .tabCount{font-size:11px;border-radius:8px;padding:1px 5px;background:#ffffff24;font-variant-numeric:tabular-nums}

.rosterTable tbody tr:last-child td{border-bottom:0}

.rosterTable .colLine{min-width:110px;font-weight:750;white-space:normal;overflow-wrap:anywhere}
.rosterTable .colPhone{min-width:70px}
.rosterTable .colRank{min-width:78px}
.rosterTable .colStatus{min-width:72px}
.rosterTable .colTime{min-width:125px;color:var(--muted);font-size:12px}
.rosterTable .colEvent{min-width:115px;max-width:145px;white-space:normal;overflow-wrap:anywhere}

.rosterTable .emptyCell{text-align:center;color:var(--muted);padding:24px 9px}

.signupFields label{margin-top:15px}
.signupFields .fieldReadonly{background:var(--surface2);color:var(--ink);font-weight:700}
.signupFields input[readonly]{cursor:default}

function showConnectionWait(){
 html('等待雲端即時連線','已識別主辦帳號，但 Firebase Realtime Database 尚未建立即時連線。為避免手機舊資料回寫，所有修改仍保持鎖定。',`<div class="card w500"><p class="sub" id="connDiag">你可以先測試資料庫的 HTTPS 讀取是否正常，再重新建立即時連線。</p><div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" class="secondary small" id="testDb">測試資料庫連線</button><button type="button" class="secondary small" id="retryDb">重新建立即時連線</button></div><p class="tiny muted" style="margin-top:12px">這兩個動作都不會寫入、刪除或覆蓋任何比賽資料。</p></div>`);
 $('testDb').onclick=async()=>{
  const b=$('testDb'),release=setBusy(b,'測試中…'),note=$('connDiag');
  try{
   // 探測不存在的單場公開節點，避免下載個資，也不依賴登入。
   const path=CONFIG.databaseURL+'/eventStates/000000000000000000000000/public.json';
   const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),12000);
   let res;try{res=await fetch(path,{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(timer)}
   if(res.ok){note.textContent='資料庫 HTTPS 公開讀取成功（HTTP '+res.status+'），正在確認主辦的雲端讀取權限…';const okay=await verifyCloudHTTPS();if(!okay)note.textContent='公開讀取成功，但主辦權限驗證未通過。請檢查上方錯誤提示。'}
   else note.textContent='資料庫 HTTP '+res.status+'：'+(res.status===401||res.status===403?'可能是 Rules 讀取權限問題。':'請檢查資料庫網址或伺服器狀態。');
  }catch(e){note.textContent='資料庫 HTTPS 連線失敗：'+(e?.name==='AbortError'?'12 秒逾時，請稍後再試。':String(e?.message||e));}
  finally{release()}
 };
 $('retryDb').onclick=()=>{
  // 不強制 goOffline()/goOnline()，以免在 iOS Safari 造成連線狀態反覆震盪。

 };
}

// iPhone / Safari：網路狀態會短暫在 true/false 間震盪，
// 狀態變動只更新提示，不清空整個畫面、不重建監聽、不覆蓋輸入表單。
// 使用者的寫入權限仍由 call() -> guard() 檢查，離線不能送出審核。
let connectionStableTimer=null;
{
 db.ref('.info/connected').on('value',snap=>{
  const now=!!snap.val();
  if(connectedKnown&&now===connected)return;
  connected=now;connectedKnown=true;if(now)everConnected=true;
  clearTimeout(connectionStableTimer);
  if(!now){connectedStable=false;connectionUI();return}

   if(!connected)return;
   connectedStable=true;connectionUI();
   // 不重新整理已經開啟的表單或管理畫面。

  if(isGoogle())verifyCloudHTTPS();
 });
}
