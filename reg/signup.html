<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>V0.1｜戰鬥陀螺・選手報名</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('bx_live_theme')==='light'?'light':'dark'}catch{}</script><style>:root{color-scheme:dark;--bg:#0b0d12;--panel:#151922;--panel2:#1c2230;--line:#303849;--text:#f7f8fa;--muted:#98a2b3;--accent:#ff5a3c;--green:#2dcf7d;--warn:#f4c84b;--red:#ffb1a5;--input:#0f131b}
:root[data-theme=light]{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--panel2:#f1f4f8;--line:#d7dde7;--text:#18212f;--muted:#687386;--accent:#ff5a3c;--green:#15965a;--warn:#a87400;--red:#b6442d;--input:#fff}
*{box-sizing:border-box}html,body{min-width:0;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{min-height:100dvh}button,input{font:inherit}button{min-height:39px;padding:8px 12px;background:var(--accent);border:1px solid transparent;color:#fff;border-radius:10px;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.alt{background:var(--panel2);color:var(--text);border-color:var(--line)}button.good{background:#163a2a;color:#9ce7b9;border-color:#28734e}button.bad{background:#3d1d1d;color:#ffbdad;border-color:#813d33}button.sm{font-size:13px;padding:6px 9px;min-height:32px}input{min-width:0;width:100%;padding:10px 12px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:16px}input:focus{outline:2px solid var(--accent);outline-offset:1px}label{display:block;color:var(--muted);font-size:13px;margin:11px 0 5px}a{color:var(--accent)}p{line-height:1.55}.muted{color:var(--muted)}.tiny{font-size:12px}.header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:var(--bg)}.top{width:min(1280px,100%);margin:auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.actions>button{white-space:nowrap}.container{max-width:1280px;margin:auto;padding:24px 14px 64px}h1{font-size:clamp(23px,3vw,32px);margin:0 0 12px}h2{font-size:20px;margin:0 0 12px}.card{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px;margin-bottom:13px;min-width:0}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.stack{display:grid;gap:10px}.dim{font-size:13px;color:var(--muted)}.status{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:13px;margin:10px 0}.status.ok{color:var(--green)}.status.warn{color:var(--warn)}.status.err{color:var(--red)}.pill{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;white-space:nowrap}.pill.pending{color:var(--warn)}.pill.approved{color:var(--green)}.pill.rejected{color:var(--red)}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.full{grid-column:1/-1}.formBtns{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap}.formBtns>*{flex:1}.tableWrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th{background:var(--panel2);white-space:nowrap;color:var(--muted)}.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}.tabbar button{min-width:0;padding:7px 2px;font-size:12px}.tabbar button[aria-selected=true]{background:var(--accent);color:#fff}.tabbar button:not([aria-selected=true]){background:var(--panel2);color:var(--muted);border-color:var(--line)}.contact{font-weight:800}.contact small{display:block;color:var(--muted);font-weight:450;margin-top:4px}.rank{white-space:nowrap;font-weight:800}.sheetWrap{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px}.sheet{width:min(470px,100%);background:var(--panel);padding:20px;border:1px solid var(--line);border-radius:17px;max-height:90dvh;overflow:auto}.hide{display:none!important}.msg{padding:11px 14px;border-radius:11px;background:var(--panel2);color:var(--muted);margin:10px 0}.close{width:100%;margin-top:13px}.public{max-width:790px;margin:auto}.public .card{max-width:640px}.big{font-weight:900;font-size:clamp(25px,6vw,34px);color:var(--green)}.summary{padding:12px 14px;background:var(--panel2);border-radius:12px;line-height:2}.badge{color:var(--muted);font-size:12px}
@media(max-width:650px){.container{padding:18px 11px 55px}.card{padding:15px}.formGrid{grid-template-columns:1fr}.brand{font-size:14px}.top button{font-size:12px;padding:7px 8px}.tableWrap table{min-width:415px}.reviewbtn{min-width:0!important;font-size:11px!important;padding:6px 4px!important}.sheetWrap{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;width:100%;padding:18px 17px calc(18px + env(safe-area-inset-bottom))}.tableWrap th,.tableWrap td{padding:9px 6px}.tableWrap th:first-child,.tableWrap td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:85px;max-width:105px}.tableWrap th:first-child{background:var(--panel2)}.tabbar button{font-size:11px}.tabbar{gap:4px}}
.brand .devVersion{display:block;margin-top:3px;font-size:10px;line-height:1.3;letter-spacing:.3px;font-weight:600;color:var(--muted);white-space:nowrap}
</style></head><body>
<header class="header"><div class="top"><div class="brand">戰鬥陀螺・線上報名<small class="devVersion" aria-label="版本 V0.1 開發測試版">V0.1 測試版</small></div><span class="pill">選手報名</span></div></header>
<main class="container public"><h1 id="title">讀取比賽資訊中…</h1><p class="muted">選手免登入；同場比賽名稱不可重複，手機後三碼與 LINE 名稱可以相同。公開查詢只顯示比賽名稱、手機後三碼及審核結果。</p><div class="status" id="notice">正在讀取最新比賽資料…</div><section class="card hide" id="entryCard"><h2>選手報名</h2><form id="signup"><label for="playerName">比賽名稱 *</label><input id="playerName" maxlength="50" required autocomplete="off" placeholder="選手參賽名稱"><label for="phone3">手機後三碼 *</label><input id="phone3" required pattern="[0-9]{3}" inputmode="numeric" maxlength="3" placeholder="例如：093"><label for="lineName">LINE 名稱 *</label><input id="lineName" maxlength="40" required autocomplete="off" placeholder="LINE 顯示名稱"><button id="submit" style="width:100%;margin-top:20px" type="submit">確認報名</button><p id="localHint" class="dim" aria-live="polite"></p></form></section><p><a id="statusLink" href="#">查看這場比賽的公開查詢表 →</a></p></main>
<div class="sheetWrap hide" id="modal" role="dialog" aria-modal="true"><section class="sheet"><h2>報名成功</h2><p class="dim">雲端已確認收到報名。正／備選順位會依審核結果及原始報名順序調整，請以公開查詢表的最新狀態為準。</p><div id="rank" class="big">已成功報名</div><div id="details" class="summary"></div><p class="dim">初始審核：待審核。正選仍須主辦審核通過才能確認參賽。</p><button id="close" class="close">關閉</button></section></div>
<script>
'use strict';
const DB='https://ljtreg-39954-default-rtdb.asia-southeast1.firebasedatabase.app',FN='https://asia-southeast1-ljtreg-39954.cloudfunctions.net/regV01Submit';
const eid=new URLSearchParams(location.search).get('event')||'';
const $=s=>document.getElementById(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let meta=null,busy=false,loadingMeta=false,lastMetaChecked=0;
// A *local-browser* soft cap: different browsers, private sessions or cleared storage can bypass it.
// Keep request IDs so replays of the same successful submission never consume two slots.
const LOCAL_LIMIT=2;
function localSignups(){try{const x=JSON.parse(localStorage.getItem('reg-v01-local-signups-'+eid)||'[]');return Array.isArray(x)?x.filter(v=>/^[0-9a-f]{48}$/.test(v)).slice(0,LOCAL_LIMIT):[]}catch{return []}}
function saveLocalSignup(id){try{const a=localSignups();if(!a.includes(id)){a.push(id);localStorage.setItem('reg-v01-local-signups-'+eid,JSON.stringify(a))}}catch{}}
function localSlotsLeft(){return Math.max(0,LOCAL_LIMIT-localSignups().length)}
function updateLocalHint(){const el=$('localHint');if(el)el.textContent='本瀏覽器每場最多成功報名 '+LOCAL_LIMIT+' 次；目前剩餘 '+localSlotsLeft()+' 次（更換瀏覽器／清除資料可能重設）。'}

function msg(t,bad=false){$('notice').className='status '+(bad?'err':'ok');$('notice').textContent=t}
async function load(){
 if(!/^[0-9a-f]{24}$/.test(eid)){msg('報名連結不正確',true);return}
 // iOS can emit several resume events rapidly: one metadata request per 15s is enough.
 if(loadingMeta||(meta&&Date.now()-lastMetaChecked<15000))return;
 loadingMeta=true;const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
 try{
  const res=await fetch(DB+'/eventsV01/'+eid+'/meta.json',{cache:'no-store',signal:ctl.signal});
  if(!res.ok)throw Error('讀取失敗（HTTP '+res.status+'）');
  const m=await res.json();if(!m||m.deleted)throw Error('找不到比賽或活動已刪除');
  meta=m;lastMetaChecked=Date.now();$('title').textContent=m.title;document.title=m.title+'｜選手報名';
  $('entryCard').classList.toggle('hide',!m.open);msg(m.open?'報名開放中':'主辦尚未開放報名',!m.open);
 }catch(e){$('entryCard').classList.add('hide');msg(e.name==='AbortError'?'網路逾時，請重新開啟頁面':(e.message||'無法確認比賽資料'),true)}
 finally{clearTimeout(tm);loadingMeta=false}
}
function rid(){return Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('')}
async function idempotency(data){const raw=new TextEncoder().encode(JSON.stringify(data)),digest=await crypto.subtle.digest('SHA-256',raw),key=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');try{const v=JSON.parse(sessionStorage.getItem('reg-v01-request-'+eid)||'null');if(v?.hash===key&&/^[0-9a-f]{48}$/.test(v.rid))return v.rid}catch{}const r=rid();try{sessionStorage.setItem('reg-v01-request-'+eid,JSON.stringify({hash:key,rid:r}))}catch{}return r}
// The callable regV01Submit returns the current rank; the browser never downloads the roster.
$('signup').addEventListener('submit',async ev=>{
 ev.preventDefault();if(busy)return;const data={eid,playerName:$('playerName').value.trim(),phone3:$('phone3').value.trim(),lineName:$('lineName').value.trim()};
 if(!data.playerName||!/^\d{3}$/.test(data.phone3)||!data.lineName){msg('請完整填寫三個欄位',true);return}
 if(localSlotsLeft()<=0){msg('本瀏覽器這場比賽已成功報名 2 次，無法再送出。若需更改資料請聯絡主辦。',true);return}
 busy=true;$('submit').disabled=true;$('submit').textContent='等待雲端確認…';
 try{const requestId=await idempotency(data),ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),20000);let r;try{r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{...data,rid:requestId}}),signal:ctl.signal})}finally{clearTimeout(tm)}const body=await r.json();if(!r.ok||body.error||!body.result?.signupNo)throw Error(body.error?.message||'報名未完成');saveLocalSignup(requestId);updateLocalHint();
 // Display server-confirmed success immediately. Final rank can change following review.
 const no=body.result.signupNo;
 $('rank').textContent=body.result.rankLabel||('原始順位 #'+no+' · 順位稍後確認');$('details').innerHTML=`<div>📅 日期：${safe(meta.eventDate)}</div><div>🕘 報到：${safe(meta.checkinTime)}</div><div>🚀 開賽：${safe(meta.startTime)}</div><div>📍 地點：${safe(meta.venue)}</div><div>💰 報名費：${safe(meta.fee)} 元</div>`;$('modal').classList.remove('hide');$('signup').reset();try{sessionStorage.removeItem('reg-v01-request-'+eid)}catch{}msg('雲端已確認報名成功');
 }catch(e){msg((e.message||'目前無法確認報名')+'。如網路中斷，請保留原資料後再按一次，系統會使用相同提交憑證。',true)}finally{busy=false;$('submit').disabled=false;$('submit').textContent='確認報名'}
});
$('close').onclick=()=>$('modal').classList.add('hide');updateLocalHint();$('statusLink').href='status.html?event='+encodeURIComponent(eid);window.addEventListener('pageshow',e=>{if(e.persisted)load()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!busy)load()});load();
</script></body></html>
