<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>選手線上報名</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('bx_live_theme')==='light'?'light':'dark'}catch{}</script><style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151922;--panel2:#1c2230;--line:#303849;--text:#f7f8fa;--muted:#98a2b3;--accent:#ff5a3c;--good:#9be7bd;--warn:#f4c84b;--bad:#ffb1a5}
:root[data-theme=light]{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--panel2:#f1f4f8;--line:#d7dde7;--text:#18212f;--muted:#687386;--accent:#ff5a3c;--good:#15965a;--warn:#986f09;--bad:#b6442d}
*{box-sizing:border-box}html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}body{min-height:100dvh}
header{background:var(--bg);border-bottom:1px solid var(--line);padding:15px 13px}header .top{max-width:880px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:17px}header small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
main{width:min(100%,880px);margin:0 auto;padding:22px 13px 75px}.banner{font-size:12px;line-height:1.5;text-align:center;background:#39231e;color:#ffdbce;padding:8px 12px}h1{font-size:clamp(22px,5.5vw,30px);line-height:1.3;margin:6px 0 10px;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:13px}.card h2{font-size:18px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:13px;margin:15px 0 6px}input{display:block;width:100%;min-width:0;min-height:45px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--text);font-size:16px}button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:var(--accent);color:white;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}a{color:var(--accent);text-decoration:none;font-weight:750}.minor{font-size:12px;color:var(--muted);line-height:1.6}.status{padding:11px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;color:var(--muted);font-size:13px;margin-bottom:14px}.status.error{border-color:#8e4740;color:var(--bad)}.status.ok{border-color:#2c7450;color:var(--good)}
.pill{white-space:nowrap;display:inline-block;padding:5px 9px;font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:99px;background:var(--panel2)}.pill.pending{color:var(--warn)}.pill.approved{color:var(--good)}.pill.rejected{color:var(--bad)}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000b;padding:14px}.sheet{max-width:460px;width:100%;max-height:90dvh;overflow:auto;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 20px 60px #0009}.sheet h2{font-size:21px;margin:0 0 8px}.rank{font-weight:900;font-size:28px;color:var(--good);margin:15px 0}.details{border-radius:12px;background:var(--panel2);padding:12px 15px;line-height:2;font-size:13px}.sheet button{width:100%;margin-top:16px}.hide{display:none!important}
@media(max-width:420px){main{padding:17px 11px 62px}.card{padding:14px}.sheet{padding:17px}}
</style></head><body>
<header><div class="top"><div><b>戰鬥陀螺・線上報名</b><small>選手報名專頁</small></div><span class="pill">報名</span></div></header>

<main><h1 id="eventTitle">正在取得比賽資料…</h1><p class="sub">填寫三項必填資料即可報名。比賽名稱及手機後三碼會出現在公開查詢表。</p><div id="status" class="status">正在取得比賽資訊…</div><section class="card hide" id="formCard"><h2>選手報名</h2><form id="signupForm"><label for="playerName">比賽名稱 *</label><input id="playerName" maxlength="50" required placeholder="選手參賽使用的名稱" autocomplete="off"><label for="phone">手機後三碼 *</label><input id="phone" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" required placeholder="例如：093"><label for="lineName">LINE 名稱 *</label><input id="lineName" maxlength="40" required placeholder="LINE 上顯示的名稱"><button id="send" type="submit" style="width:100%;margin-top:19px">確認報名</button></form></section><p class="minor"><a id="boardLink" href="#">查看這場比賽的公開審核表 →</a></p></main>
<div id="modal" class="modal hide" role="dialog" aria-modal="true" aria-label="報名成功"><div class="sheet"><h2>✅ 報名成功</h2><p class="minor">報名已由 Firebase 雲端確認。請查詢公開表格的最新順位及審核狀態。</p><div class="rank" id="rank">順位計算中</div><div class="details" id="details"></div><p class="minor">審核狀態：待審核。正備選順位會隨主辦審核遞補而變更。</p><button id="close" type="button">關閉</button></div></div>
<script>
'use strict';
// LIGHTWEIGHT PUBLIC SIGNUP: no Firebase SDK; one event meta GET + one callable POST.
const DB='https://ljtreg-39954-default-rtdb.asia-southeast1.firebasedatabase.app';
const FUNCTION='https://asia-southeast1-ljtreg-39954.cloudfunctions.net/regSubmit';
const eid=new URLSearchParams(location.search).get('event')||'';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let meta=null,submitting=false;
function status(msg,bad=false){$('status').textContent=msg;$('status').className='status'+(bad?' error':' ok')}
async function load(){
 if(!/^[0-9a-f]{24}$/.test(eid)){status('連結缺少正確的比賽代碼',true);return}
 try{
  const r=await fetch(DB+'/eventStates/'+eid+'/public.json',{cache:'no-store'});
  if(!r.ok)throw Error(r.status===401||r.status===403?'公開比賽資料尚未開放讀取':'雲端暫時無法取得比賽資訊');
  const data=await r.json();if(!data)throw Error('這場比賽不存在或已刪除');
  meta=data;$('eventTitle').textContent=meta.title;document.title=meta.title+'｜選手報名';
  $('formCard').classList.toggle('hide',!meta.open);
  status(meta.open?'報名開放中・以雲端成功回覆為準':'這場比賽目前停止報名',!meta.open);
 }catch(e){status(e.message,true);$('formCard').classList.add('hide')}
}
function makeRid(){return Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('')}
async function rememberRequest(body){
 // Only retain a request fingerprint + random ID, never player personal data.
 const input=new TextEncoder().encode(JSON.stringify(body));
 const digest=await crypto.subtle.digest('SHA-256',input);
 const signature=Array.from(new Uint8Array(digest),v=>v.toString(16).padStart(2,'0')).join('');
 const key='reg_submit_pending_'+eid;
 try{const old=JSON.parse(sessionStorage.getItem(key)||'null');if(old?.signature===signature&&/^[0-9a-f]{48}$/.test(old.rid))return old.rid;}catch{}
 const rid=makeRid();try{sessionStorage.setItem(key,JSON.stringify({signature,rid}))}catch{}
 return rid;
}
function clearRequest(){try{sessionStorage.removeItem('reg_submit_pending_'+eid)}catch{}}
function showSuccess(label){
 $('rank').textContent=label;const e=meta;
 $('details').innerHTML=`<div>📅 比賽日期：${esc(e.eventDate)}</div><div>🕘 報到時間：${esc(e.checkinTime)}</div><div>🚀 開賽時間：${esc(e.startTime)}</div><div>📍 比賽地點：${esc(e.venue)}</div><div>💰 報名費：${esc(e.fee)} 元</div>`;
 $('modal').classList.remove('hide');$('close').focus();
}
$('close').onclick=()=>$('modal').classList.add('hide');
$('boardLink').href='status.html?event='+encodeURIComponent(eid);
$('signupForm').addEventListener('submit',async ev=>{
 ev.preventDefault();if(submitting)return;
 const playerName=$('playerName').value.trim(),phone3=$('phone').value.trim(),lineName=$('lineName').value.trim();
 if(!playerName||playerName.length>50||!/^[0-9]{3}$/.test(phone3)||!lineName||lineName.length>40){status('三個欄位都必須正確填寫',true);return}
 if(!meta?.open){status('目前尚未確認活動開放，請重新整理',true);return}
 const body={eid,playerName,phone3,lineName};
 submitting=true;$('send').disabled=true;$('send').textContent='雲端確認中…';
 try{
  const rid=await rememberRequest(body);
  const r=await fetch(FUNCTION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{...body,rid}})});
  const result=await r.json();if(!r.ok||result.error||!result.result?.signupNo)throw Error(result.error?.message||'報名未獲雲端確認，請稍後使用相同資料重試');
  // This acknowledgment is returned only after one committed RTDB transaction.
  clearRequest();showSuccess(result.result.rankLabel||'已報名');$('signupForm').reset();status('雲端已確認報名成功');
 }catch(e){status(e.message||'目前無法確認是否成功，請勿更改資料，可使用相同資料重新送出以避免重號。',true)}
 finally{submitting=false;$('send').disabled=false;$('send').textContent='確認報名'}
});
if(/^[0-9a-f]{24}$/.test(eid))load();else status('無效的比賽連結',true);
window.addEventListener('pageshow',e=>{if(e.persisted)load()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!submitting)load()});
</script></body></html>
