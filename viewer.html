<script>/* Beyblade X V0.1 public incremental synchronization protocol.
 * Browser + Node 22 compatible. No Firebase dependency.
 * Cache is read-only and never eligible for an authoritative score write.

      patch:Object.fromEntries(Object.entries(part[4]||{}).map(([k,v])=>[UNPACK_KEYS[k]||k,v]))};

    if (kind==="r")return {kind:"rr",finalRR:part[1]};
    if (kind==="t")return {kind:"meta",meta:part[1]};
    if (kind==="s")return {kind:"structure"};
    if (kind==="c")return {kind:"closed"};

    if (!raw || typeof raw !== "object") return [];

    newCache, usableCache, normalizeRound, applyChange, replay,
    parseHistory, shouldReplaceRound, publicMatch, clone, packChange, expandMarker};
});

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>

const params = new URLSearchParams(location.search);
const isDemo = params.has("demo");
const eventId = isDemo ? "vnext-demo-24" : (params.get("event") || "");

const DB = "https://ljt-beyblade-x-default-rtdb.asia-southeast1.firebasedatabase.app";
const basePath = `eventsV01/${encodeURIComponent(eventId)}/public`;

let data = null;

function drawLinks(){

  const canvas=document.querySelector('.bracketCanvas');
  const svg=document.querySelector('.bracketLinks');

      const sourcePoints=pair.map(el=>({el,...point(el,'right')}));
      const maxSourceX=Math.max(...sourcePoints.map(p=>p.x));
      const elbowX=maxSourceX+Math.max(16,(t.x-maxSourceX)*0.52);

      sourcePoints.forEach(p=>{
        const live=p.el.classList.contains('done')?'live':'';
        paths.push(
          `<path class="${live}" d="M ${p.x.toFixed(1)} ${p.y.toFixed(1)} H ${elbowX.toFixed(1)} V ${t.y.toFixed(1)} H ${t.x.toFixed(1)}"/>`
        );
      });
    });
  }

  if(data.finalRR){
    const last=rs.length-1;
    const src=[...canvas.querySelectorAll(`.bracketMatch[data-ri="${last}"]`)];
    const target=canvas.querySelector('.rrPanel');

    if(target&&src.length){
      const t=point(target,'left');
      const sourcePoints=src.map(el=>({el,...point(el,'right')}));
      const maxSourceX=Math.max(...sourcePoints.map(p=>p.x));
      const elbowX=maxSourceX+Math.max(16,(t.x-maxSourceX)*0.52);

      sourcePoints.forEach((p,k)=>{
        const live=p.el.classList.contains('done')?'live':'';
        const ty=t.y+(k-(sourcePoints.length-1)/2)*12;
        paths.push(
          `<path class="${live}" d="M ${p.x.toFixed(1)} ${p.y.toFixed(1)} H ${elbowX.toFixed(1)} V ${ty.toFixed(1)} H ${t.x.toFixed(1)}"/>`
        );
      });
    }
  }

  svg.innerHTML=paths.join('');
}
function setScale(v){
  scale=Math.max(.30,Math.min(1.2,v));
  const c=document.querySelector('.bracketCanvas'),st=document.querySelector('.bracketStage');if(!c||!st)return;
  c.style.transform=`scale(${scale})`;st.style.width=Math.ceil(c.scrollWidth*scale)+'px';st.style.height=Math.ceil(c.scrollHeight*scale)+'px';
  const z=document.querySelector('.zoomLabel');if(z)z.textContent=Math.round(scale*100)+'%';
}
function zoom(d){setScale(scale+d);requestAnimationFrame(drawLinks)}
function fit(){
  const sc=document.querySelector('.bracketScroll'),c=document.querySelector('.bracketCanvas');if(!sc||!c)return;
  setScale(Math.max(.30,Math.min(.92,(sc.clientWidth-14)/c.scrollWidth)));sc.scrollTo({left:0,top:0,behavior:'smooth'});requestAnimationFrame(drawLinks)
}
function autoScale(){
  const n=eventCount();
  setScale(innerWidth<=640?(n>=64?.52:n>=32?.60:.72):(n>=64?.68:n>=32?.78:.9))
}
function toggleFull(){document.body.classList.toggle('fullscreen');setTimeout(()=>{autoScale();drawLinks()},80)}
addEventListener('resize',()=>{if(eventId){clearTimeout(window.__rz);window.__rz=setTimeout(()=>{autoScale();drawLinks()},120)}});

// On-demand requests are limited to the columns the user is actually viewing.
async function loadAllRounds() {
  if (!state.meta) return;
  setStatus("手動載入完整公開樹狀圖中…");
  const indices = state.meta.rounds.map((_, ri) => ri);
  for (let i = 0; i < indices.length; i += 2) {
    await Promise.all(indices.slice(i, i+2).map((ri) => loadRound(ri)));
  }
  if (state.meta.hasFinalRR) await loadRR();
  if (state.meta) setStatus("已依要求載入全部輪次。", "ok");
}
$("loadAll").addEventListener("click", loadAllRounds);
window.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") resume("visible");
  else { stopStream(); clearTimeout(resumeTimer); }
});
window.addEventListener("pageshow", (e) => { if (e.persisted) resume("bfcache"); });
window.addEventListener("online", () => resume("online"));
window.addEventListener("pagehide", () => { stopStream(); clearTimeout(resumeTimer); });
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  viewClosedIfExpired();
  if (!state.meta) return;
  // Normally a connected SSE needs zero redundant GETs. Exception: if the
  // connection is SILENT (including no keep-alive) for >20-25 minutes, one
  // randomized health GET detects half-open proxies, preventing stuck scores.
  const now = Date.now();
  if (!streamOpen && now - lastTinyCheckAt >= 30000) checkTinyVersion();
  else if (streamOpen && lastSseFrameAt > 0 &&
    now - Math.max(lastSseFrameAt, lastTinyCheckAt) >= HEALTHY_STALL_CHECK_MS) {
    checkTinyVersion();
  }
}, 30000 + Math.round(Math.random()*3000));

// Off-network demonstration. Never writes Firebase and shows same UI as real viewer.
function createDemo() {
  const count = Number(params.get("demo") || "24") === 64 ? 64 : 24;
  const rounds = [];
  let n = count, k=0;
  while (n > (count === 24 ? 3 : 2)) {
    const matches = Array.from({length: Math.ceil(n/2)}, (_, i) => {
      const initial = k===0;
      return {a: initial ? `選手 ${i*2+1}` : "待定",
        b: initial ? `選手 ${i*2+2}` : "待定", sa: "", sb: "", winner: null};
    });
    rounds.push({name:`第 ${k+1} 輪（${n} 強）`,matches});
    n=Math.ceil(n/2);k++;
  }
  if (count===64) rounds.push({name:"冠軍及季軍賽",placementFinal:true,matches:[
    {a:"待定",b:"待定",sa:"",sb:"",winner:null},
    {a:"待定",b:"待定",sa:"",sb:"",winner:null}
  ]});
  const publicUntil = Date.now() + 86400000;
  const pub = {
    meta: {id: eventId, name:`離線示範・${count} 人賽（不會連線）`,
      mode: count===24?"free":"single",freeFinal:count===24?"rr3":"champ",
      rosterCount:count,rounds:rounds.map((r)=>({name:r.name,matchCount:r.matches.length,
        placementFinal:!!r.placementFinal})),hasFinalRR:count===24,
      publicOpen:true,publicUntil,structureVersion:1,appVersion:'V0.1'},
    rounds:Object.fromEntries(rounds.map((r,ri)=>[ri,{
      revision:0,matches:Object.fromEntries(r.matches.map((m,i)=>[i,m]))}])),
    finalRR:count===24?{revision:0,players:["待定 A","待定 B","待定 C"],matches:[]}:null,
    sync:{seq:0,structureVersion:1,publicOpen:true,last:null},changes:{}
  };
  return pub;
}
async function demoGet(path, query) {
  if (!window.__bxDemoReads) window.__bxDemoReads = [];
  window.__bxDemoReads.push(path);
  await new Promise((resolve)=>setTimeout(resolve,50));
  if (path==="changes") {
    const start = JSON.parse(query.startAt), end = JSON.parse(query.endAt);
    return Object.fromEntries(Object.entries(demoData.changes)
      .filter(([k])=>k>=start&&k<=end));
  }
  const keys=path.split("/");
  return BXSync.clone(keys.reduce((v,k)=>v==null?null:v[k],demoData));
}
function startDemoStream() {
  streamOpen=true;
  setStatus("離線示範模式：只讀模擬資料，完全不連 Firebase。", "ok");
}
function demoAdvance() {
  const pub = demoData;
  const match = pub.rounds[0].matches[0];
  const updated = {...match,sa:Math.min(6,Number(match.sa||0)+1),sb:0};
  if(updated.sa>=4)updated.winner=updated.a;
  const seq=pub.sync.seq+1;
  const rev=++pub.rounds[0].revision;
  pub.rounds[0].matches[0]=updated;
  const entry={seq,kind:"match",ri:0,mi:0,roundRevision:rev,match:updated};
  pub.sync={seq,structureVersion:1,publicOpen:true,last:entry};
  pub.changes[BXSync.seqKey(seq)]=entry;
  enqueueSync(pub.sync);
}
function showDemoControls() {
  const actions=$("demoControls");
  actions.classList.remove("hidden");
  $("demoAdvance").onclick=demoAdvance;
  $("demoSkip").onclick=()=>{
    for(let i=0;i<5;i++){
      const m=demoData.rounds[0].matches[1];
      const seq=demoData.sync.seq+1,rev=++demoData.rounds[0].revision;
      const updated={...m,sa:i+1,sb:0,winner:i===4?m.a:null};
      demoData.rounds[0].matches[1]=updated;
      const entry={seq,kind:"match",ri:0,mi:1,roundRevision:rev,match:updated};
      demoData.changes[BXSync.seqKey(seq)]=entry;
      demoData.sync={seq,structureVersion:1,publicOpen:true,last:entry};
    }
    enqueueSync(demoData.sync); // Test history-gap recovery.
  };
}

async function main() {
  if (!BXSync.isValidId(eventId)) {
    setStatus("網址缺少有效的賽事 event ID。", "error"); return;
  }
  if (isDemo) { demoData=createDemo(); showDemoControls(); }
  else loadCache();
  // SSE-first: its initial put includes the tiny sync marker, so no duplicate
  // startup GET sync. Metadata and visible rounds remain lazy.
  // Demo intentionally uses getJson("sync") to keep offline smoke tests valid.
  resume("initial");
}
main();
